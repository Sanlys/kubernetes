[package]
name = "s3-vfs-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "s3-vfs-proxy"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
bytes = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"
percent-encoding = "2"
quick-xml = "0.36"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
