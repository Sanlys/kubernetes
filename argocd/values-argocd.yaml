global:
  domain: argocd.k8s.lysakermoen.com
configs:
  params:
    # Serve plain HTTP; TLS terminates at the Ingress like every other app
    server.insecure: true
    # Spans from the API server, repo server and application controller
    otlp.address: tempo.monitoring.svc.cluster.local:4317
    otlp.insecure: true
controller:
  replicas: 2
repoServer:
  replicas: 2
  volumes:
    - name: repo-cache
      emptyDir: {}
  volumeMounts:
    - name: repo-cache
      mountPath: /tmp/argocd
server:
  replicas: 2
  ingress:
    enabled: true
    ingressClassName: internal
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-internal
    extraTls:
      - hosts:
        - argocd.k8s.lysakermoen.com
        secretName: argocd-k8s-lysakermoen-com
redis:
  enabled: true
