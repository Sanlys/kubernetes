name: smb-gateway

on:
  push:
    branches: [main]
    paths:
      - services/smb-gateway/**
      - .github/workflows/smb-gateway.yaml
  pull_request:
    paths:
      - services/smb-gateway/**
      - .github/workflows/smb-gateway.yaml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sanlys/smb-gateway

jobs:
  integration:
    name: integration (${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # nfs is the default for mounts with a change feed and is the path
        # the kernel-cache invalidation exists for; it needs the runner's
        # kernel NFS client, which this sandbox-free VM has.
        transport: [nfs, fuse]
    defaults:
      run:
        working-directory: services/smb-gateway
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image (runs unit tests)
        uses: docker/build-push-action@v6
        with:
          context: services/smb-gateway
          load: true
          tags: smb-gateway:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load kernel modules
        run: sudo modprobe nfs && sudo modprobe fuse
      - name: Integration test
        env:
          TRANSPORT: ${{ matrix.transport }}
        run: ./test/integration.sh smb-gateway:dev

  publish:
    needs: integration
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A version tag is published once and never overwritten (the cluster
      # pins it with IfNotPresent); bump VERSION to release a change.
      - id: tags
        run: |
          v=$(cat services/smb-gateway/VERSION)
          tags="${IMAGE}:sha-${GITHUB_SHA}"
          if docker buildx imagetools inspect "${IMAGE}:${v}" >/dev/null 2>&1; then
            echo "::warning::${IMAGE}:${v} already exists; publishing only the sha tag. Bump services/smb-gateway/VERSION to release."
          else
            tags="${tags},${IMAGE}:${v}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: services/smb-gateway
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SMB gateway for Ceph S3 buckets, restic repositories and Syncthing
          cache-from: type=gha
