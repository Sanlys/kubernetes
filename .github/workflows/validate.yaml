name: validate

# Gate for Renovate automerge (renovate.json): Renovate only merges once this
# check is green. Runs on every PR (not path-filtered) because Renovate treats
# a PR with no checks at all as pending and would never merge it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Validate manifests and Helm renders
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet --break-system-packages pyyaml
          python3 scripts/ci/validate-manifests.py

  renovate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate renovate.json
        run: npx --yes --package renovate@44 -- renovate-config-validator --strict renovate.json
