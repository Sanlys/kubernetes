# This node's extra HDD (osd.3, moved from the retired talos-jwk-gs2) is
# attached via an external USB-SATA dock, since this mini PC has no internal
# SATA/SAS bay. The dock's bridge chip is ASMedia (idVendor=174c,
# idProduct=55aa), a chipset with well-known UASP instability under
# sustained write load on Linux. Confirmed 2026-11-06: the link reset
# repeatedly (every ~10-15 min) then fully disconnected mid-write during
# Ceph backfill, crashing osd.3 with a genuine kernel I/O error (not a
# Ceph/Rook bug). Forcing Bulk-Only Transport (ignoring UAS) for this
# specific VID:PID is the standard Linux mitigation for this chip.
machine:
  install:
    extraKernelArgs:
      - usb-storage.quirks=174c:55aa:u
