# Dedicated LAN IP for the read-only API endpoint, so the router can forward
# a public port to exactly this and nothing else changes for the frpc path.
# Same traefik-public pods and websecure entrypoint; only the k8s-ro
# IngressRoute is of any use here, other public hostnames answer too but
# they're public via frps already.
#
# Router: forward <public port> -> 10.0.6.245:443 (TCP). 443 is safest:
# the cloud egress proxy may only allow CONNECT to 443.
#
# 10.0.6.245 is in metallb default-pool and not pinned by anything in the
# repo - check `kubectl get svc -A | grep 10.0.6.245` before enabling.
apiVersion: v1
kind: Service
metadata:
  name: traefik-public-k8s-ro
  namespace: traefik-public
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.6.245
  # Real client IPs in Traefik's access log (see traefik-public app.yaml
  # for why Cluster loses them here).
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-public-traefik-public
  ports:
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
