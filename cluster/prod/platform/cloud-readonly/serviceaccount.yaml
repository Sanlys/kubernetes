apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-readonly
  namespace: cloud-readonly
# No pod ever runs as this SA - it only exists to hold the token below.
automountServiceAccountToken: false
---
# Long-lived token, populated by the token controller (the Secret in git has
# no data - nothing sensitive is committed). Copy it out once with
#   kubectl -n cloud-readonly get secret cloud-readonly-token \
#     -o jsonpath='{.data.token}' | base64 -d
# and store it as the cloud environment's K8S_RO_TOKEN secret.
#
# Rotate / revoke: `kubectl -n cloud-readonly delete secret cloud-readonly-token`.
# The old token stops working immediately; Argo CD's selfHeal recreates the
# Secret and the controller mints a fresh token. Kill switch for everything:
# delete the ServiceAccount (or disable this app).
#
# Chosen over `kubectl create token --duration=...` because a bound token
# can't be revoked short of deleting the whole SA, and the cloud session
# has no identity of its own to mint short-lived tokens from.
apiVersion: v1
kind: Secret
metadata:
  name: cloud-readonly-token
  namespace: cloud-readonly
  annotations:
    kubernetes.io/service-account.name: cloud-readonly
type: kubernetes.io/service-account-token
