apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.fairwinds.com/stable
    chart: vpa
    targetRevision: 5.2.0
    helm:
      releaseName: vpa
      values: |
        # A separate, namespace-scoped recommender/updater per Minecraft server
        # was tried and reverted: the chart's ClusterRoles/ClusterRoleBindings
        # use fixed, non-templated names (not Release.Name-prefixed), so every
        # extra release of this same chart fights the others over the same
        # cluster-scoped RBAC objects - a real, observed OutOfSync/ownership
        # conflict, not a theoretical one. One recommender/updater handles every
        # namespace instead. The slower CPU decay Minecraft wanted is applied
        # here cluster-wide rather than scoped to it - memory keeps the default,
        # fast OOM-triggered eviction path everywhere, unaffected by this flag.
        recommender:
          extraArgs:
            # Default is 24h; tripled so a transient CPU dip/spike takes much
            # longer to move any workload's recommendation enough to trigger a
            # Recreate - most load-bearing for Minecraft, but harmless (likely
            # beneficial) for Ceph daemons too, whose quiet-window usage already
            # looked lower than their real burst needs.
            cpu-histogram-decay-half-life: "72h"
  destination:
    server: https://kubernetes.default.svc
    namespace: vpa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
