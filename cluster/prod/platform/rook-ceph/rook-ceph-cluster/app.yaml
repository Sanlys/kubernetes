apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph-cluster
    targetRevision: v1.21.0
    helm:
      values: |
        cephImage:
          imagePullPolicy: IfNotPresent
        cephClusterSpec:
          mon:
            allowMultiplePerNode: false
          mgr:
            allowMultiplePerNode: false
          crashCollector:
            disable: false
          security:
            cephx:
              daemon:
                keyRotationPolicy: KeyGeneration
                keyGeneration: 2
          storage:
            useAllNodes: true
            useAllDevices: true
          dashboard:
            enabled: true
            ssl: false
          network:
            connections:
              requireMsgr2: true
        cephBlockPools:
          - name: ceph-blockpool
            spec:
              failureDomain: host
              replicated:
                size: 3
            storageClass:
              enabled: true
              name: ceph-block
              annotations:
                argocd.argoproj.io/sync-options: Replace=true,Force=true
              labels: {}
              isDefault: true
              reclaimPolicy: Delete
              allowVolumeExpansion: true
              volumeBindingMode: "Immediate"
              mountOptions: []
              allowedTopologies: []
              parameters:
                imageFormat: "2"
                imageFeatures: layering
                csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
                csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
                csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph
                csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
                csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
                csi.storage.k8s.io/controller-modify-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/controller-modify-secret-namespace: rook-ceph
                csi.storage.k8s.io/node-publish-secret-name: rook-csi-rbd-node
                csi.storage.k8s.io/node-publish-secret-namespace: rook-ceph
                csi.storage.k8s.io/fstype: ext4
        toolbox:
          enabled: true
        monitoring:
          enabled: true
          createPrometheusRules: true
        cephObjectStores:
          - name: ceph-objectstore
            storageClass:
              enabled: true
              name: ceph-bucket
              reclaimPolicy: Retain
              volumeBindingMode: Immediate
              annotations:
                argocd.argoproj.io/sync-options: Replace=true,Force=true
              labels: {}
              parameters:
                region: us-east-1
            spec:
              metadataPool:
                failureDomain: host
                replicated:
                  size: 3
                deviceClass: ssd
              dataPool:
                failureDomain: host
                erasureCoded:
                  dataChunks: 2
                  codingChunks: 1
                deviceClass: hdd
                parameters:
                  bulk: "true"
              preservePoolsOnDelete: true
              gateway:
                port: 80
                resources:
                  limits:
                    memory: "2Gi"
                  requests:
                    cpu: "1000m"
                    memory: "1Gi"
                instances: 2
                priorityClassName: system-cluster-critical
        ingress:
          dashboard:
            ingressClassName: internal
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-internal
            host:
              name: ceph.k8s.lysakermoen.com
            tls:
              - hosts:
                - ceph.k8s.lysakermoen.com
                secretName: ceph-k8s-lysakermoen-com

  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]

