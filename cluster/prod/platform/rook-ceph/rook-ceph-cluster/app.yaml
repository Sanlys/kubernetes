apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph-cluster
    targetRevision: v1.21.1
    helm:
      values: |
        cephImage:
          imagePullPolicy: IfNotPresent
        cephClusterSpec:
          mon:
            allowMultiplePerNode: false
          mgr:
            allowMultiplePerNode: false
          crashCollector:
            disable: false
          security:
            cephx:
              daemon:
                keyRotationPolicy: KeyGeneration
                keyGeneration: 2
          storage:
            useAllNodes: true
            useAllDevices: true
          dashboard:
            enabled: true
            ssl: false
            # Rook forcibly syncs mgr/dashboard/PROMETHEUS_API_HOST to this
            # field on every reconcile, resetting it to empty if unset here -
            # that's why `ceph dashboard set-prometheus-api-host` alone never
            # stuck.
            prometheusEndpoint: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
            prometheusEndpointSSLVerify: false
          network:
            connections:
              requireMsgr2: true
        cephBlockPools:
          - name: ceph-blockpool
            spec:
              failureDomain: host
              replicated:
                size: 3
            storageClass:
              enabled: true
              name: ceph-block
              annotations:
                argocd.argoproj.io/sync-options: Replace=true,Force=true
              labels: {}
              isDefault: true
              reclaimPolicy: Delete
              allowVolumeExpansion: true
              volumeBindingMode: "Immediate"
              mountOptions: []
              allowedTopologies: []
              parameters:
                imageFormat: "2"
                imageFeatures: layering
                csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
                csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
                csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph
                csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
                csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
                csi.storage.k8s.io/controller-modify-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/controller-modify-secret-namespace: rook-ceph
                csi.storage.k8s.io/node-publish-secret-name: rook-csi-rbd-node
                csi.storage.k8s.io/node-publish-secret-namespace: rook-ceph
                csi.storage.k8s.io/fstype: ext4
        toolbox:
          enabled: true
        monitoring:
          enabled: true
          createPrometheusRules: true
        cephObjectStores:
          - name: ceph-objectstore
            storageClass:
              enabled: true
              name: ceph-bucket
              reclaimPolicy: Retain
              volumeBindingMode: Immediate
              annotations:
                argocd.argoproj.io/sync-options: Replace=true,Force=true
              labels: {}
              parameters:
                region: us-east-1
            spec:
              metadataPool:
                failureDomain: host
                replicated:
                  size: 3
                deviceClass: ssd
              dataPool:
                failureDomain: host
                erasureCoded:
                  dataChunks: 2
                  codingChunks: 1
                # No deviceClass: the live pool's CRUSH rule (rule_id 11) has
                # always taken from the unrestricted "default" root, not
                # "default~hdd". Declaring deviceClass: hdd here only made
                # Rook 1.21's EC-profile reconcile try (and fail) to force an
                # override Ceph gates behind --yes-i-really-mean-it, for a
                # constraint that was never actually enforced.
                parameters:
                  bulk: "true"
              preservePoolsOnDelete: true
              gateway:
                port: 80
                resources:
                  limits:
                    memory: "2Gi"
                  requests:
                    cpu: "1000m"
                    memory: "1Gi"
                instances: 2
                priorityClassName: system-cluster-critical
        # HTTPRoute for the dashboard lives in rook-ceph-rgw-ingress's
        # directory instead - this chart has no extraObjects/extraManifests
        # equivalent to inject one directly.
        ingress: {}

  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]

