apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rook-ceph-rgw
  namespace: rook-ceph
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: ["s3.k8s.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: rook-ceph-rgw-ceph-objectstore
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rook-ceph-rgw-pub
  namespace: rook-ceph
spec:
  parentRefs:
    - name: traefik-public-gateway
      namespace: traefik-public
      sectionName: websecure
  hostnames: ["s3.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: rook-ceph-rgw-ceph-objectstore
          port: 80
