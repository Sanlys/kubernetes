# Not actually RGW - this app's directory is just where rook-ceph's
# hand-written HTTPRoutes live, since rook-ceph-cluster's chart has no
# extraObjects/extraManifests to inject this into directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rook-ceph-dashboard
  namespace: rook-ceph
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: ["ceph.k8s.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: rook-ceph-mgr-dashboard
          port: 7000
