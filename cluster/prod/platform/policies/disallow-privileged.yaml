apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged
spec:
  validationFailureAction: Audit
  # Audit-only, so never block pod creation if Kyverno itself is down
  # (e.g. mid-upgrade or during a cold cluster start).
  webhookConfiguration:
    failurePolicy: Ignore
  background: true
  rules:
    - name: privileged-containers
      match:
        resources:
          kinds: ["Pod"]
          namespaceSelector:
            matchExpressions:
              - key: role
                operator: NotIn
                values: ["infra"]
      validate:
        message: "Privileged containers are not allowed"
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): "false"
