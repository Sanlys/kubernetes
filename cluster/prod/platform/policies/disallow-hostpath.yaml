apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-hostpath
spec:
  validationFailureAction: Audit
  # Audit-only, so never block pod creation if Kyverno itself is down
  # (e.g. mid-upgrade or during a cold cluster start).
  webhookConfiguration:
    failurePolicy: Ignore
  background: true
  rules:
    - name: hostpath-not-allowed
      match:
        resources:
          kinds: ["Pod"]
          namespaceSelector:
            matchExpressions:
              - key: role
                operator: NotIn
                values: ["infra"]
      validate:
        message: "hostPath volumes are not allowed"
        pattern:
          spec:
            =(volumes):
              - X(hostPath): "null"