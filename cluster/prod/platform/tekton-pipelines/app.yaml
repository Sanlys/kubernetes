apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-pipelines
  namespace: argocd
  annotations:
    # Pipelines' CRDs must exist before Triggers/Dashboard reference them.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    # Vendored, not pointed at tektoncd/pipeline.git directly - that repo's
    # raw manifests use ko:// image placeholders only resolved by Tekton's
    # own release build; this is the already-resolved official release.yaml
    # for the exact version already running (v1.6.0), adopted as-is.
    repoURL: https://github.com/Sanlys/kubernetes.git
    targetRevision: main
    path: cluster/prod/platform/tekton-pipelines
    directory:
      exclude: "app.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines
  # Unlike most kinds, ArgoCD doesn't auto-strip status on CustomResource-
  # Definition - acceptedNames/conditions/storedVersions are server-managed
  # and show as permanent phantom diffs otherwise.
  #
  # The 6 CRDs with a v1beta1<->v1 conversion webhook (pipelines,
  # pipelineruns, tasks, taskruns, customruns, stepactions) also need their
  # conversion.webhook.clientConfig ignored: tekton-pipelines-webhook (its
  # own controller, Knative-derived) actively patches caBundle/service.path/
  # service.port on these at runtime, independent of the static release.yaml
  # - fighting Argo's selfHeal over it would just be a permanent reconcile
  # war, possibly flapping caBundle empty mid-fight.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /spec/conversion/webhook/clientConfig/caBundle
        - /spec/conversion/webhook/clientConfig/service/path
        - /spec/conversion/webhook/clientConfig/service/port
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # CRDs and the CRs/webhooks that depend on them ship in the same file.
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true, ServerSideApply=true]
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
