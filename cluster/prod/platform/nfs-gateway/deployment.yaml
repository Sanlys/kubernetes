apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-gateway-cache
  namespace: nfs-gateway
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-block-ssd
  resources:
    requests:
      # 400Gi floor comes from qbittorrent's own hard-won history (see
      # qbittorrent.yaml): a ~154GiB single file claimed its whole
      # previous 150Gi cache PVC and would have hit ENOSPC a few GiB
      # short. With --vfs-cache-mode writes (see below), this only needs
      # to cover the largest file(s) actively being written at once
      # across every app now sharing this one gateway, not the whole
      # library.
      storage: 400Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-gateway
  namespace: nfs-gateway
spec:
  selector:
    app: nfs-gateway
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-gateway
  namespace: nfs-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-gateway
  template:
    metadata:
      labels:
        app: nfs-gateway
    spec:
      initContainers:
        - name: copy-rclone-binary
          image: rclone/rclone:1.75
          command: ["sh", "-c", "cp \"$(command -v rclone)\" /shared-bin/rclone && chmod +x /shared-bin/rclone"]
          volumeMounts:
            - name: rclone-bin
              mountPath: /shared-bin
      containers:
        - name: nfs-gateway
          # Pinned to a digest, not just the floating 12-slim tag, so
          # Renovate still proposes real Debian 12 point-release/security
          # rebuilds (new digest, same tag) instead of us silently never
          # updating. The major jump to debian:13-slim is separately
          # blocked in renovate.json - confirmed it segfaults the
          # CGO-linked rclone binary this image copies in (see #316).
          image: debian:12-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
          envFrom:
            - secretRef:
                name: nfs-gateway-media-library-creds
            - configMapRef:
                name: nfs-gateway-media-library-conn
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -e
              # quay.io/ceph/ceph (tried first) ships ganesha.nfsd but
              # only the RGW/CephFS/RADOS FSALs, built from a repo that's
              # no longer configured at runtime - no way to add FSAL_VFS
              # there. Debian packages every FSAL separately too, but
              # nfs-ganesha-vfs is a plain apt package from Debian's own
              # repos, no extra repo config needed. fuse3 is for rclone's
              # FUSE library, which shells out to fusermount3 even when
              # running as root/privileged.
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y nfs-ganesha nfs-ganesha-vfs fuse3
              # our ganesha.conf is mounted at /config/ganesha.conf, not
              # directly at /etc/ganesha/ganesha.conf - mounting it there
              # directly makes dpkg see a pre-existing "modified" conffile
              # when it tries to install the package's own default,
              # triggering an interactive prompt with no stdin to answer it.
              cp /config/ganesha.conf /etc/ganesha/ganesha.conf
              # normally created by the package's systemd unit/tmpfiles.d,
              # neither of which run here.
              mkdir -p /var/run/ganesha
              # FSAL_VFS resolves which filesystem backs an export's path
              # via setmntent(/etc/mtab) - normal Debian systems have this
              # as a symlink to /proc/self/mounts, set up by the base
              # system/init, which doesn't run here.
              [ -e /etc/mtab ] || ln -s /proc/self/mounts /etc/mtab
              export RCLONE_CONFIG_CEPHBUCKET_TYPE=s3
              export RCLONE_CONFIG_CEPHBUCKET_PROVIDER=Ceph
              export RCLONE_CONFIG_CEPHBUCKET_ENV_AUTH=false
              export RCLONE_CONFIG_CEPHBUCKET_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
              export RCLONE_CONFIG_CEPHBUCKET_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
              export RCLONE_CONFIG_CEPHBUCKET_ENDPOINT="http://$BUCKET_HOST:$BUCKET_PORT"
              export RCLONE_CONFIG_CEPHBUCKET_REGION="$BUCKET_REGION"
              mkdir -p /mnt/s3/media-library /var/cache/rclone
              # Go's GC is not cgroup-aware and will expand the heap to
              # fill whatever it believes is available rather than this
              # container's actual memory.limit, then get OOM-killed -
              # same lesson already paid for once in qbittorrent.yaml.
              export GOMEMLIMIT=2500MiB
              # vfs-cache-mode full (tried first) caches every file this
              # gateway touches, not just ones being written - confirmed
              # live: sonarr/jellyfin's read activity alone fully
              # downloaded an entire TV season (~40GB) into the cache
              # with no eviction, and it would have kept growing
              # unbounded. qbittorrent's own history already proved
              # "writes" is sufficient for actual write traffic (only
              # actively-open files are staged locally) without that
              # unbounded growth from unrelated read-only apps.
              setsid /opt/rclone-bin/rclone mount "cephbucket:$BUCKET_NAME" /mnt/s3/media-library \
                --vfs-cache-mode writes \
                --cache-dir /var/cache/rclone \
                --allow-other \
                --uid 1000 --gid 1000 --umask 022 \
                --log-level INFO \
                > /proc/1/fd/1 2>/proc/1/fd/2 < /dev/null &
              # mountpoint -q alone isn't a strong enough readiness check -
              # it can return true just after the mount(2) syscall
              # completes but before rclone's FUSE handler can actually
              # serve stat() calls yet, which made Ganesha's FSAL_VFS
              # fail on startup (resolve_posix_filesystem: ENOENT) despite
              # the mount looking "up".
              for i in $(seq 1 30); do
                mountpoint -q /mnt/s3/media-library && ls /mnt/s3/media-library >/dev/null 2>&1 && break
                sleep 1
              done
              if ! (mountpoint -q /mnt/s3/media-library && ls /mnt/s3/media-library >/dev/null 2>&1); then
                echo "rclone mount did not come up after 30s" >&2
                exit 1
              fi
              exec ganesha.nfsd -F -L STDERR -N NIV_INFO
          ports:
            - containerPort: 2049
              name: nfs
          volumeMounts:
            - name: rclone-bin
              mountPath: /opt/rclone-bin
              readOnly: true
            - name: ganesha-config
              mountPath: /config/ganesha.conf
              subPath: ganesha.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/rclone
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  mountpoint -q /mnt/s3/media-library || exit 1
                  # pgrep isn't in this minimal Debian image (no procps) -
                  # ganesha.nfsd is exec'd as PID 1 directly, so check that.
                  [ "$(cat /proc/1/comm)" = "ganesha.nfsd" ] || exit 1
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            # GOMEMLIMIT above caps rclone's own heap at 2500MiB; this
            # needs room for that plus Ganesha itself, the NFS client
            # buffers for every connected app, and reclaimable page cache
            # for the CephFS/RBD-backed cache dir - same reasoning as
            # qbittorrent's own 3Gi limit, bumped further since this now
            # serves every app, not just one.
            requests: { cpu: "200m", memory: "1Gi" }
            limits: { memory: "4Gi" }
      volumes:
        - name: rclone-bin
          emptyDir: {}
        - name: ganesha-config
          configMap:
            name: nfs-gateway-config
        - name: cache
          persistentVolumeClaim:
            claimName: nfs-gateway-cache
