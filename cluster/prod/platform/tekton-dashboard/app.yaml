apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-dashboard
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    # Vendored for the same reason as tekton-pipelines/tekton-triggers -
    # already-resolved official release (v0.63.1, release-full.yaml - the
    # read-write variant, matching the live Deployment's --read-only=false)
    # for the exact version already running, adopted as-is. httproute.yaml
    # replaces the old hand-added, untracked Ingress.
    repoURL: https://github.com/Sanlys/kubernetes.git
    targetRevision: main
    path: cluster/prod/platform/tekton-dashboard
    directory:
      exclude: "app.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        # Same server-defaulting phantom diffs as tekton-pipelines' CRDs:
        # names.listKind/singular default from kind when omitted,
        # conversion defaults to {strategy: None} when omitted,
        # preserveUnknownFields stops being echoed back once a CRD uses
        # schema-level x-kubernetes-preserve-unknown-fields.
        - /spec/names/listKind
        - /spec/names/singular
        - /spec/conversion
        - /spec/preserveUnknownFields
    # Same Gateway API ParentReference/BackendRef defaulting as every other
    # hand-written HTTPRoute today - only shows up once ServerSideApply is on.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tekton-dashboard
      jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
        - /spec/rules/0/matches
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true, ServerSideApply=true]
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
