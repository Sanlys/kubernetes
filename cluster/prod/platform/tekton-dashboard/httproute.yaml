apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: ["tekton.k8s.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: tekton-dashboard
          port: 9097
