# cert-manager's chart has no prometheusRule toggle at all (only
# servicemonitor) - metrics were already being scraped with nothing
# evaluating them. Standalone PrometheusRule using cert-manager's own
# well-known, stable metric names rather than chart-provided content,
# since none exists.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  groups:
    - name: cert-manager
      rules:
        - alert: CertManagerCertNotReady
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not ready"
            description: "cert-manager reports {{ $labels.namespace }}/{{ $labels.name }} as not Ready for over 30 minutes - renewal is likely failing."
        - alert: CertManagerCertExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 14 days"
            description: "cert-manager Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 14 days and hasn't renewed yet."
