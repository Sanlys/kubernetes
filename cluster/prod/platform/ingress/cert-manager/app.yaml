apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.3
      helm:
        values: |
          crds:
            enabled: true
            keep: true
          prometheus:
            enabled: true
            servicemonitor:
              enabled: true
    # The chart has no prometheusRule mechanism at all - see alerting/.
    - repoURL: https://github.com/Sanlys/kubernetes.git
      targetRevision: main
      path: cluster/prod/platform/ingress/cert-manager/alerting
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels:
        role: infra
