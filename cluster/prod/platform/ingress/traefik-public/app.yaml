apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-public
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.0.0
    helm:
      values: |
        deployment:
          replicas: 2
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 1
        ingressClass:
          enabled: false
        providers:
          kubernetesIngress:
            enabled: false
          kubernetesCRD:
            enabled: true
          kubernetesGateway:
            enabled: true
            # Scoped to its own Gateway only - see the matching comment on
            # traefik-internal's app.yaml for why this matters with two
            # Traefik instances in the cluster.
            gateways:
              - name: traefik-public-gateway
                namespace: traefik-public
          # NGINX compatibility: serves the existing public Ingresses and
          # their nginx.ingress.kubernetes.io annotations unchanged. Still
          # pointed at ingress-nginx-public's "public" class/controller -
          # nginx-public keeps owning that IngressClass object and keeps
          # serving real traffic on 10.0.6.241 until the actual cutover.
          # This instance runs in parallel on a throwaway IP so everything
          # can be verified before anything is switched over.
          kubernetesIngressNGINX:
            enabled: true
            controllerClass: k8s.io/ingress-nginx-public
            ingressClass: public
            ingressClassByName: true
            watchIngressWithoutClass: false
            publishService:
              enabled: true
        ports:
          web:
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            transport:
              respondingTimeouts:
                # Same reasoning as traefik-internal: large S3/git/photo
                # uploads shouldn't get cut off at Traefik v3's 60s default.
                readTimeout: 0
            # Real internet traffic arrives via frpc (cluster/prod/platform/
            # frpc - frps on an Oracle VPS tunnels to frpc in-cluster, which
            # connects to this entrypoint directly). Without this, every
            # single external visitor/bot/client showed up here as frpc's
            # own pod IP - confirmed live via Traefik's own access log
            # (ClientHost) before this was discovered. frpc's TCP proxy for
            # "web" now sends transport.proxyProtocolVersion = "v2".
            #
            # Deliberately scoped to frpc's one pod IP, not the whole pod
            # CIDR - anything hitting this entrypoint directly over the LAN
            # (the 10.0.6.240/.241 path blackbox-exporter's internal/
            # external-local probes and ad-hoc testing both use) doesn't
            # send a Proxy Protocol header, and a CIDR-wide trust would
            # make Traefik expect one from them too. frpc is a stable,
            # rarely-restarted single-replica Deployment - if its pod IP
            # ever changes, this needs updating to match.
            proxyProtocol:
              trustedIPs:
                - 10.244.9.28/32
        service:
          type: LoadBalancer
          spec:
            loadBalancerIP: 10.0.6.241
            # Was Cluster (the default) - with classic kube-proxy
            # (Cilium's kube-proxy-replacement is off here) a packet can
            # get forwarded to a Traefik pod on a different node than the
            # one MetalLB's L2 announcer elected, and that hop SNATs away
            # the real client IP. Confirmed live: Traefik's own access
            # logs only ever showed pod-CIDR IPs as ClientHost, even for
            # genuine external traffic - no public app behind this
            # Service has ever seen real visitor IPs. MetalLB is L2-mode
            # here, which already funnels all traffic through one elected
            # node regardless of this setting, so the practical cost is
            # losing load distribution across the 2 replicas (only the
            # one sharing a node with the active announcer gets traffic)
            # in exchange for correct source IPs - failover still works,
            # just via MetalLB re-electing a node (a few seconds) instead
            # of kube-proxy's near-instant pod-level failover.
            externalTrafficPolicy: Local
        metrics:
          prometheus:
            serviceMonitor:
              enabled: true
        accessLog:
          enabled: true
          format: json
        tracing:
          otlp:
            enabled: true
            grpc:
              enabled: true
              endpoint: tempo.monitoring.svc.cluster.local:4317
              insecure: true
        # Chart GatewayClass "traefik-public" (distinct name from internal's
        # "traefik" - each GatewayClass belongs to one controller instance,
        # and the "gateways:" scoping above is what actually keeps the two
        # instances from reconciling each other's Gateway regardless).
        gatewayClass:
          enabled: true
          name: traefik-public
        gateway:
          name: traefik-public-gateway
          listeners:
            web:
              port: 8000
              protocol: HTTP
            websecure:
              port: 8443
              protocol: HTTPS
              hostname: "*.lysakermoen.com"
              namespacePolicy:
                from: All
              certificateRefs:
                - name: public-wildcard-tls
            # harbor.k8s.lysakermoen.com doesn't match *.lysakermoen.com
            # (two labels before the base domain) but needs to stay on the
            # public IP regardless - same port, different hostname is a
            # valid Gateway API listener combination. Reuses the internal
            # wildcard cert via the ReferenceGrant below rather than issuing
            # a second cert for the exact same domain.
            harbor:
              port: 8443
              protocol: HTTPS
              hostname: "harbor.k8s.lysakermoen.com"
              namespacePolicy:
                from: All
              certificateRefs:
                - name: k8s-wildcard-tls
                  namespace: traefik
        # The chart's own dashboard IngressRoute only matches
        # PathPrefix(`/dashboard`)||PathPrefix(`/api`) - root "/" never
        # reaches api@internal, so it 404s instead of getting the redirect
        # traefik-internal's dashboard gets at root. Replaced below with a
        # catch-all IngressRoute instead, same shape as traefik-internal's
        # own HTTPRoute-to-api@internal wiring.
        ingressRoute:
          dashboard:
            enabled: false
        extraObjects:
          # Binds to the "traefik" entrypoint (8080), which
          # ports.traefik.expose.default (left false, see below) keeps out
          # of the public LoadBalancer Service entirely - this doesn't
          # expose anything externally, it just gives the Service/HTTPRoute
          # below (which proxy into that same port) a full catch-all to
          # reach, letting api@internal's own handler deal with paths
          # (including its root->/dashboard/ redirect) exactly like
          # traefik-internal's dashboard does.
          - apiVersion: traefik.io/v1alpha1
            kind: IngressRoute
            metadata:
              name: traefik-public-dashboard
            spec:
              entryPoints: ["traefik"]
              routes:
                - kind: Rule
                  match: "PathPrefix(`/`)"
                  services:
                    - kind: TraefikService
                      name: api@internal
          # Lets the "harbor" listener above reference a Secret living in
          # the traefik namespace instead of this release's own namespace -
          # ReferenceGrant must live in the namespace being referenced.
          - apiVersion: gateway.networking.k8s.io/v1beta1
            kind: ReferenceGrant
            metadata:
              name: traefik-public-harbor-listener
              namespace: traefik
            spec:
              from:
                - group: gateway.networking.k8s.io
                  kind: Gateway
                  namespace: traefik-public
              to:
                - group: ""
                  kind: Secret
                  name: k8s-wildcard-tls
          # ports.traefik.expose.default would add 8080 to the same
          # LoadBalancer Service already sitting on the public IP - this
          # dedicated ClusterIP Service keeps the dashboard off that path
          # entirely, only reachable via the HTTPRoute below.
          - apiVersion: v1
            kind: Service
            metadata:
              name: traefik-public-dashboard
            spec:
              type: ClusterIP
              selector:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-public-traefik-public
              ports:
                - name: traefik
                  port: 8080
                  targetPort: traefik
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: traefik-public-dashboard
            spec:
              parentRefs:
                - name: traefik-gateway
                  namespace: traefik
                  sectionName: websecure
              hostnames: ["traefik-public.k8s.lysakermoen.com"]
              rules:
                - backendRefs:
                    - name: traefik-public-dashboard
                      port: 8080
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: public-wildcard
            spec:
              secretName: public-wildcard-tls
              dnsNames: ["*.lysakermoen.com"]
              issuerRef:
                kind: ClusterIssuer
                name: letsencrypt-public
          # Taken over from ingress-nginx-public with an identical spec
          # (spec.controller is immutable). Prune=false keeps it alive while
          # it moves between the two apps in either direction - same pattern
          # traefik-internal used for the "internal" class.
          - apiVersion: networking.k8s.io/v1
            kind: IngressClass
            metadata:
              name: public
              annotations:
                argocd.argoproj.io/sync-options: Prune=false
            spec:
              controller: k8s.io/ingress-nginx-public
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik-public
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-public-gateway
      jsonPointers:
        # Listener array order is alphabetical by name (harbor, web,
        # websecure), not declaration order - harbor=0, websecure=2.
        - /spec/listeners/0/tls/certificateRefs/0/group
        - /spec/listeners/0/tls/certificateRefs/0/kind
        - /spec/listeners/2/tls/certificateRefs/0/group
        - /spec/listeners/2/tls/certificateRefs/0/kind
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: traefik-public-dashboard
      jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
        - /spec/rules/0/matches
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
