apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-internal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.7.1
    helm:
      values: |
        deployment:
          replicas: 2
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 1
        # The IngressClass is created below; the chart's own "traefik" class is not used
        ingressClass:
          enabled: false
        providers:
          kubernetesIngress:
            enabled: false
          kubernetesCRD:
            enabled: true
          # Gateway API next to the Ingresses; CRDs come from the gateway-api-crds app
          kubernetesGateway:
            enabled: true
            # Lets HTTPRoutes here point at Traefik's internal services (api@internal)
            crossProviderNamespaces: [traefik]
          # NGINX compatibility: serves the existing Ingresses and their
          # nginx.ingress.kubernetes.io annotations unchanged
          kubernetesIngressNGINX:
            enabled: true
            controllerClass: k8s.io/ingress-nginx-internal
            ingressClass: internal
            ingressClassByName: true
            watchIngressWithoutClass: false
            publishService:
              enabled: true
        ports:
          web:
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            transport:
              respondingTimeouts:
                # Traefik v3 defaults to 60s for reading a whole request, which cuts long S3 uploads
                readTimeout: 0
        service:
          type: LoadBalancer
          spec:
            loadBalancerIP: 10.0.6.240
        metrics:
          prometheus:
            serviceMonitor:
              enabled: true
        # JSON to stdout; Alloy already ships every pod's logs to Loki
        accessLog:
          enabled: true
          format: json
        tracing:
          otlp:
            enabled: true
            grpc:
              enabled: true
              endpoint: tempo.monitoring.svc.cluster.local:4317
              insecure: true
        # Chart Gateway "traefik-gateway". The HTTPS listener terminates TLS with a
        # wildcard cert, so routes in any namespace only need a hostname.
        gateway:
          listeners:
            web:
              port: 8000
              protocol: HTTP
            websecure:
              port: 8443
              protocol: HTTPS
              hostname: "*.k8s.lysakermoen.com"
              namespacePolicy:
                from: All
              certificateRefs:
                - name: k8s-wildcard-tls
        # The dashboard is served by the HTTPRoute below instead
        ingressRoute:
          dashboard:
            enabled: false
        extraObjects:
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: k8s-wildcard
            spec:
              secretName: k8s-wildcard-tls
              dnsNames: ["*.k8s.lysakermoen.com"]
              issuerRef:
                kind: ClusterIssuer
                name: letsencrypt-internal
          # Read-only Traefik dashboard on the internal IP
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: traefik-dashboard
            spec:
              parentRefs:
                - name: traefik-gateway
                  sectionName: websecure
              hostnames: ["traefik.k8s.lysakermoen.com"]
              rules:
                - backendRefs:
                    - group: traefik.io
                      kind: TraefikService
                      name: api@internal
          # Taken over from ingress-nginx-internal with an identical spec
          # (spec.controller is immutable). Prune=false keeps it alive while
          # it moves between the two apps in either direction.
          - apiVersion: networking.k8s.io/v1
            kind: IngressClass
            metadata:
              name: internal
              annotations:
                ingressclass.kubernetes.io/is-default-class: "true"
                argocd.argoproj.io/sync-options: Prune=false
            spec:
              controller: k8s.io/ingress-nginx-internal
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  # Gateway API's SecretObjectReference/ParentReference group+kind default
  # server-side (group:"", kind:Secret / group:gateway.networking.k8s.io,
  # kind:Gateway) when omitted; our manifests omit them, so these are
  # permanent phantom diffs, not real drift.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      jsonPointers:
        - /spec/listeners/1/tls/certificateRefs/0/group
        - /spec/listeners/1/tls/certificateRefs/0/kind
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: traefik-dashboard
      jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        # backendRefs[].weight defaults to 1 when omitted; rules[].matches
        # defaults to a catch-all PathPrefix "/" when the rule declares no
        # matches at all. Our manifest declares neither.
        - /spec/rules/0/backendRefs/0/weight
        - /spec/rules/0/matches
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # Gateway API CRDs may land after this app on the first sync
    syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
