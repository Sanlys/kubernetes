apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: ["hubble.k8s.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
