apiVersion: batch/v1
kind: CronJob
metadata:
  name: snapshot
  namespace: snapshots
spec:
  schedule: "0 */6 * * *"
  # Was suspended with an empty history (no VolumeSnapshots ever existed) and
  # a stale PVC list (syncthing/syncthing-pvc hasn't been the live PVC since
  # the RWX migration - see syncthing-backups-restic/backup-cron.yaml).
  # Un-suspended, list refreshed to current PVC names, and expanded to cover
  # every app with real RWO data that otherwise has zero backup of any kind
  # (Vaultwarden was the most urgent - a 335-day-old password vault with
  # nothing protecting it). Still RBD-only (csi-rbdplugin-snapclass): the
  # RWX CephFS PVCs (syncthing-pvc-rwx etc.) need a separate CephFS
  # VolumeSnapshotClass this cluster doesn't have yet, so they're excluded
  # here - restic covers syncthing-pvc-rwx directly instead.
  suspend: false
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: snapshotter
          containers:
            - name: snapshot
              image: bitnami/kubectl:latest@sha256:8f59408f9e896fc8992a0660a56687545bd06751f26531b4a26fca6d5dc7562d
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  TS=$(date +%Y%m%d-%H%M%S)
                  # Keep the last 8 snapshots per PVC (48h at this 6h
                  # cadence) - this is a fast local "oops" rollback, not the
                  # long-term record (that's restic's job), so a short
                  # bounded window keeps Ceph usage predictable.
                  KEEP=8
                  PVC_LIST="mirror/archmirror-pvc monitoring/prometheus-monitoring-kube-prometheus-prometheus-db-prometheus-monitoring-kube-prometheus-prometheus-0 monitoring/storage-loki-0 syncthing/syncthing-config vaultwarden/vaultwarden-pvc forgejo/forgejo-data forgejo/pgdata-postgres-0 immich/immich-upload immich/pgdata-postgres-0 photoprism/photoprism-storage photoprism/data-mariadb-0 linkwarden/linkwarden-data linkwarden/pgdata-postgres-0 tools-idp/tools-idp-postgres tools-hello/tools-hello-postgres tools-game-mgr/tools-game-mgr-postgres"
                  FAIL=0
                  for ITEM in $PVC_LIST; do
                    NS="${ITEM%%/*}"
                    PVC="${ITEM##*/}"
                    SNAP="${PVC}-${TS}"
                    echo "Creating snapshot $SNAP in $NS for PVC $PVC"
                    # No "pvc: ${PVC}" label here (first version of this had
                    # one) - the prometheus PVC's name alone is 103 bytes,
                    # over the 63-byte label-VALUE limit, so that `kubectl
                    # apply` always failed, and `restartPolicy: OnFailure`
                    # kept re-running this whole script from the top on
                    # every retry, creating a fresh archmirror-pvc snapshot
                    # each time (see commit message - this ran for real,
                    # live, before being caught). Pruning below matches by
                    # name PREFIX instead, which has no such length limit.
                    # Without set -e too now: one PVC's failure (this one
                    # included) no longer aborts every other PVC in the
                    # list, or re-runs already-completed ones on retry.
                    if ! cat <<EOF | kubectl apply -f -
                  apiVersion: snapshot.storage.k8s.io/v1
                  kind: VolumeSnapshot
                  metadata:
                    name: ${SNAP}
                    namespace: ${NS}
                  spec:
                    volumeSnapshotClassName: csi-rbdplugin-snapclass
                    source:
                      persistentVolumeClaimName: ${PVC}
                  EOF
                    then
                      echo "FAILED: snapshot of $NS/$PVC" >&2
                      FAIL=1
                      continue
                    fi

                    # Prune: keep only the newest $KEEP snapshots whose name
                    # starts with "${PVC}-" (each PVC in the list above is
                    # the only one of its exact name in its own namespace,
                    # so this prefix is unambiguous per-namespace).
                    OLD=$(kubectl -n "$NS" get volumesnapshot -o jsonpath='{.items[*].metadata.name}' \
                      | tr ' ' '\n' | grep "^${PVC}-" | sort | head -n -"$KEEP")
                    for OLDSNAP in $OLD; do
                      echo "Pruning old snapshot $OLDSNAP in $NS"
                      kubectl -n "$NS" delete volumesnapshot "$OLDSNAP" --ignore-not-found
                    done
                  done
                  exit $FAIL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          restartPolicy: OnFailure
