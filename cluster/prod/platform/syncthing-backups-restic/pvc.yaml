apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Never let Argo CD prune/delete this claim: the StorageClass reclaim
  # policy is Delete, so losing the claim would destroy the data.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: restic-cache
  namespace: syncthing
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
