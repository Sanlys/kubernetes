apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-prune
  namespace: syncthing
spec:
  # Sunday 03:07, not 03:00: at 03:00 it raced the */15 restic-backup for
  # the repo lock (failed backup job 29911860 on 2026-11-15, AI-025). The
  # 03:00 backup normally finishes in ~1 min. Both sides also wait for the
  # lock (--retry-lock) instead of failing: prune takes ~16 min, so the
  # backups that start meanwhile wait up to 30 min for it.
  schedule: "7 3 * * 0"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: restic
            image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
            command:
            - /bin/sh
            - -c
            - |
              restic unlock &&
              restic forget --retry-lock 30m \
                --keep-hourly=24 \
                --keep-daily=7 \
                --keep-weekly=4 \
                --keep-monthly=12 \
                --keep-yearly=unlimited \
                --prune
            envFrom:
            - secretRef:
                name: restic-credentials
          restartPolicy: OnFailure
