apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: syncthing-backups-restic
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Sanlys/kubernetes.git
    targetRevision: main
    path: cluster/prod/platform/syncthing-backups-restic
    directory:
      # harbor-pull-secret.enc.yaml and backblaze-secret.enc.yaml are
      # sops-encrypted and applied by hand, like every other secret here
      # (see services/restic-backup's releasing instructions) - same
      # pattern as smb-gateway's app.yaml.
      exclude: "{app.yaml,secret.enc.yaml,harbor-pull-secret.enc.yaml,backblaze-secret.enc.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: syncthing
  syncPolicy:
    automated: { prune: true, selfHeal: true }
