apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-backup
  namespace: syncthing
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # syncthing-pvc-rwx is CephFS (RWX): this no longer needs to co-locate
      # with the syncthing Deployment's pod, so a stuck node can't block it.
      # That same RWX move is what introduced CephFS MDS capability
      # contention with Syncthing's own long-lived session (it holds caps
      # across nearly the whole tree from continuous live-sync activity) -
      # under the old RWO/RBD setup there was no MDS/cap layer at all, so
      # this didn't happen. Confirmed via live correlation during a run:
      # OSDs and RGW show nothing during the stalls, local disk/network on
      # the backup pod are idle too - the delay is cap-negotiation with
      # Syncthing's session, not storage congestion.
      #
      # No activeDeadlineSeconds: both 1800s and 3600s got killed mid-run
      # without finishing. The contention is bursty, not a hang - every
      # observed run kept making forward progress, just unevenly - so
      # instead of guessing at a bigger number, let it run unbounded and
      # see where it actually lands. This does reopen the original risk a
      # deadline was meant to prevent: a genuinely stuck Pending run would
      # block every future scheduled run forever under concurrencyPolicy:
      # Forbid, since nothing would kill it.
      template:
        spec:
          containers:
          - name: restic
            image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
            args:
            - backup
            - /data
            - --cache-dir
            - /cache
            - --host
            - syncthing
            # Temporary: every run has hit the 30-min deadline since the
            # media-fs pg_num change, with no clear infra-side cause found
            # by inspecting Ceph directly. --verbose=2 prints per-file
            # progress so the next run's logs show exactly where time goes.
            - --verbose=2
            envFrom:
            - secretRef:
                name: restic-credentials
            volumeMounts:
            - name: syncthing-data
              mountPath: /data
              readOnly: true
            - name: cache
              mountPath: /cache
          volumes:
          - name: syncthing-data
            persistentVolumeClaim:
              claimName: syncthing-pvc-rwx
          - name: cache
            persistentVolumeClaim:
              claimName: restic-cache
          restartPolicy: OnFailure
