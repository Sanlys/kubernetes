apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-backup
  namespace: syncthing
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # syncthing-pvc-rwx is CephFS (RWX): this no longer needs to co-locate
      # with the syncthing Deployment's pod, so a stuck node can't block it.
      # This CronJob had no activeDeadlineSeconds at all before, so a stuck
      # Pending run would've blocked every subsequent 15-minute run forever
      # under Forbid - 1800s (2x the schedule interval) as a safety net.
      activeDeadlineSeconds: 1800
      template:
        spec:
          containers:
          - name: restic
            image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
            args:
            - backup
            - /data
            - --cache-dir
            - /cache
            - --host
            - syncthing
            envFrom:
            - secretRef:
                name: restic-credentials
            volumeMounts:
            - name: syncthing-data
              mountPath: /data
              readOnly: true
            - name: cache
              mountPath: /cache
          volumes:
          - name: syncthing-data
            persistentVolumeClaim:
              claimName: syncthing-pvc-rwx
          - name: cache
            persistentVolumeClaim:
              claimName: restic-cache
          restartPolicy: OnFailure
