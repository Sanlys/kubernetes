apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-backup
  namespace: syncthing
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # syncthing-pvc-rwx is CephFS (RWX): this no longer needs to co-locate
      # with the syncthing Deployment's pod, so a stuck node can't block it.
      # That same RWX move is what introduced CephFS MDS capability
      # contention with Syncthing's own long-lived session (it holds caps
      # across nearly the whole tree from continuous live-sync activity) -
      # under the old RWO/RBD setup there was no MDS/cap layer at all, so
      # this didn't happen. Confirmed via live correlation during a run:
      # OSDs and RGW show nothing during the stalls, local disk/network on
      # the backup pod are idle too - the delay is cap-negotiation with
      # Syncthing's session, not storage congestion.
      #
      # No activeDeadlineSeconds: both 1800s and 3600s got killed mid-run
      # without finishing. The contention is bursty, not a hang - every
      # observed run kept making forward progress, just unevenly - so
      # instead of guessing at a bigger number, let it run unbounded and
      # see where it actually lands. This does reopen the original risk a
      # deadline was meant to prevent: a genuinely stuck Pending run would
      # block every future scheduled run forever under concurrencyPolicy:
      # Forbid, since nothing would kill it.
      template:
        spec:
          serviceAccountName: restic-db-dump
          imagePullSecrets:
            - name: harbor-pull
          containers:
          - name: restic
            # restic + kubectl baked in (see services/restic-backup) -
            # installing kubectl via apk on every 15-minute run was wasted
            # work and an extra point of failure for something that never
            # changes between runs.
            image: harbor.k8s.lysakermoen.com/library/restic-backup:v0.3.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -u
                FAIL=0

                echo "=== syncthing (files) ==="
                # Temporary: every run has hit the 30-min deadline since the
                # media-fs pg_num change, with no clear infra-side cause found
                # by inspecting Ceph directly. --verbose=2 prints per-file
                # progress so the next run's logs show exactly where time goes.
                restic backup /data --cache-dir /cache --host syncthing --verbose=2 || FAIL=1

                # DB dumps land in the SAME repo, tagged "db", one restic
                # host per app - same place/timeline as the file backups
                # above (`restic snapshots` lists everything together).
                # Plain-text pg_dump/mysqldump output (no -Fc, no gzip) so
                # restic's content-defined chunking can actually dedupe
                # between runs; written to a temp file rather than piped via
                # --stdin so a failed `kubectl exec` can't be masked by
                # restic trivially "succeeding" on empty/closed stdin (ash
                # has no `pipefail` to catch that on the pipe form).
                #
                # Each dump runs over the target's own trusted local
                # Unix-socket connection (Postgres's default pg_hba.conf,
                # MariaDB via its own already-mounted env var referenced by
                # name) - this job never reads or sees any app's DB
                # password itself.
                dump() {
                  NAME="$1"; NS="$2"; POD="$3"; CMD="$4"
                  TMP="/tmp/${NAME}.sql"
                  echo "=== $NAME ($NS/$POD) ==="
                  if ! kubectl -n "$NS" exec "$POD" -- sh -c "$CMD" > "$TMP"; then
                    echo "FAILED: $NAME dump (exec)" >&2
                    FAIL=1
                    rm -f "$TMP"
                    return
                  fi
                  if ! restic backup "$TMP" --cache-dir /cache --host "$NAME" --tag db; then
                    echo "FAILED: $NAME dump (restic backup)" >&2
                    FAIL=1
                  fi
                  rm -f "$TMP"
                }

                # Same idea, but the pod name is resolved by label instead
                # of a fixed name: the "tools" repo's shared chart
                # (github.com/Sanlys/tools, deploy/charts/tool-library)
                # deploys postgres as a Deployment, not a StatefulSet, so
                # the pod name's hash suffix changes every rollout. RBAC
                # for these 3 namespaces is correspondingly broader (no
                # resourceNames restriction) - see db-dump-rbac.yaml.
                dump_by_label() {
                  NAME="$1"; NS="$2"; LABEL="$3"; CMD="$4"
                  POD=$(kubectl -n "$NS" get pods -l "$LABEL" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                  if [ -z "$POD" ]; then
                    echo "FAILED: $NAME dump (no pod matching $LABEL in $NS)" >&2
                    FAIL=1
                    return
                  fi
                  dump "$NAME" "$NS" "$POD" "$CMD"
                }

                # vaultwarden's own built-in backup command (>=1.32.1,
                # VACUUM INTO) is explicitly safe to run against the live
                # db - writes a timestamped standalone .sqlite3 file into
                # /data itself, which we stream out and then delete from
                # the live pod (otherwise these pile up forever). The
                # non-db files (rsa_key.pem, and any future attachments -
                # Vaultwarden stores those as separate files, not in the
                # db) are static/rarely-written, so a live tar of them
                # alongside is safe the same way the pg_dump/mysqldump
                # targets below are.
                dump_vaultwarden() {
                  NS="vaultwarden"
                  echo "=== vaultwarden ($NS) ==="
                  POD=$(kubectl -n "$NS" get pods -l app=vaultwarden -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                  if [ -z "$POD" ]; then
                    echo "FAILED: vaultwarden (no pod matching app=vaultwarden)" >&2
                    FAIL=1
                    return
                  fi

                  BACKUP_OUT=$(kubectl -n "$NS" exec "$POD" -- /vaultwarden backup 2>&1)
                  BACKUP_FILE=$(echo "$BACKUP_OUT" | sed -n "s/.*Backup to '\(.*\)' was successful.*/\1/p")
                  if [ -z "$BACKUP_FILE" ]; then
                    echo "FAILED: vaultwarden backup command ($BACKUP_OUT)" >&2
                    FAIL=1
                    return
                  fi

                  TMP="/tmp/vaultwarden.sqlite3"
                  if ! kubectl -n "$NS" exec "$POD" -- cat "/${BACKUP_FILE}" > "$TMP"; then
                    echo "FAILED: vaultwarden backup stream" >&2
                    FAIL=1
                    kubectl -n "$NS" exec "$POD" -- rm -f "/${BACKUP_FILE}" >/dev/null 2>&1
                    rm -f "$TMP"
                    return
                  fi
                  kubectl -n "$NS" exec "$POD" -- rm -f "/${BACKUP_FILE}" >/dev/null 2>&1

                  if ! restic backup "$TMP" --cache-dir /cache --host vaultwarden --tag db; then
                    echo "FAILED: vaultwarden restic backup (db)" >&2
                    FAIL=1
                  fi
                  rm -f "$TMP"

                  TMP2="/tmp/vaultwarden-files.tar"
                  if ! kubectl -n "$NS" exec "$POD" -- tar -cf - --exclude=./icon_cache --exclude=./tmp --exclude=./lost+found --exclude='./db.sqlite3*' -C /data . > "$TMP2"; then
                    echo "FAILED: vaultwarden files tar" >&2
                    FAIL=1
                    rm -f "$TMP2"
                    return
                  fi
                  if ! restic backup "$TMP2" --cache-dir /cache --host vaultwarden --tag file; then
                    echo "FAILED: vaultwarden restic backup (files)" >&2
                    FAIL=1
                  fi
                  rm -f "$TMP2"
                }

                dump_vaultwarden

                dump forgejo forgejo postgres-0 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"'
                dump immich immich postgres-0 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"'
                dump linkwarden linkwarden postgres-0 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"'
                dump photoprism photoprism mariadb-0 'mysqldump -u"$MARIADB_USER" -p"$MARIADB_PASSWORD" "$MARIADB_DATABASE"'
                dump_by_label tools-idp tools-idp app.kubernetes.io/name=idp-postgres 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"'
                dump_by_label tools-hello tools-hello app.kubernetes.io/name=hello-postgres 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"'
                dump_by_label tools-game-mgr tools-game-mgr app.kubernetes.io/name=game-mgr-postgres 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"'
                # Harbor's own postgres (robot accounts, project config -
                # not the registry's actual image blobs, which aren't
                # backed up here). Bitnami chart, stable StatefulSet name.
                dump harbor harbor harbor-database-0 'pg_dump -U postgres registry'
                # cnpg-central: both databases are empty right now (nothing
                # uses this cluster yet), but wired up anyway so it's
                # already covered the moment something does. CNPG promotes
                # a different pod to primary on failover, so (like the
                # tools-* apps) this resolves by label, not a fixed name -
                # see db-dump-rbac.yaml.
                dump_by_label database-main database "cnpg.io/cluster=cnpg-central-cluster,cnpg.io/instanceRole=primary" 'pg_dump -U postgres database'
                dump_by_label database-app database "cnpg.io/cluster=cnpg-central-cluster,cnpg.io/instanceRole=primary" 'pg_dump -U postgres app'

                exit $FAIL
            envFrom:
            - secretRef:
                name: restic-credentials
            volumeMounts:
            - name: syncthing-data
              mountPath: /data
              readOnly: true
            - name: cache
              mountPath: /cache
          volumes:
          - name: syncthing-data
            persistentVolumeClaim:
              claimName: syncthing-pvc-rwx
          - name: cache
            persistentVolumeClaim:
              claimName: restic-cache
          restartPolicy: OnFailure
