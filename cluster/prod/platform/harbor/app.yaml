apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.19.4
      helm:
        valueFiles:
          - $values/cluster/prod/platform/harbor/values.yaml
    - repoURL: https://github.com/Sanlys/kubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  # volumeClaimTemplates[].metadata.creationTimestamp is a known Kubernetes
  # JSON-marshaling quirk (metav1.Time's MarshalJSON emits "null" for a zero
  # value regardless of omitempty) on nested embedded objects; the chart
  # never declares it, so it's a permanent phantom diff, not real drift.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: harbor-redis
      jsonPointers:
        - /spec/volumeClaimTemplates/0/metadata/creationTimestamp
    - group: apps
      kind: StatefulSet
      name: harbor-database
      jsonPointers:
        - /spec/volumeClaimTemplates/0/metadata/creationTimestamp
    - group: apps
      kind: StatefulSet
      name: harbor-trivy
      jsonPointers:
        - /spec/volumeClaimTemplates/0/metadata/creationTimestamp
    # These secrets are regenerated with fresh random values by the chart
    # on every render (no lookup reuse succeeds in Argo's render context),
    # so selfHeal was rotating them and bouncing core/jobservice/registry
    # on every reconcile. harbor-core's token CA (tls.crt/tls.key) is
    # unconditionally regenerated via genCA with no lookup fallback at all.
    - kind: Secret
      name: harbor-core
      jsonPointers:
        - /data/CSRF_KEY
        - /data/secret
        - /data/tls.crt
        - /data/tls.key
    - kind: Secret
      name: harbor-jobservice
      jsonPointers:
        - /data/JOBSERVICE_SECRET
    - kind: Secret
      name: harbor-registry
      jsonPointers:
        - /data/REGISTRY_HTTP_SECRET
    - kind: Secret
      name: harbor-registry-htpasswd
      jsonPointers:
        # Ignoring the whole object: it's the only key under /data, and
        # ignoring just /data/REGISTRY_HTPASSWD leaves a residual "data: {}"
        # diff once that one field is stripped from the comparison.
        - /data
    # Cascading effect of the above: these Deployments embed sha256
    # checksums of the secrets in a pod template annotation to trigger
    # restarts on real secret changes. Since the secrets above never
    # stabilize, these checksums never stabilize either.
    - group: apps
      kind: Deployment
      name: harbor-core
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
        - /spec/template/metadata/annotations/checksum~1secret-jobservice
    - group: apps
      kind: Deployment
      name: harbor-jobservice
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
        - /spec/template/metadata/annotations/checksum~1secret-core
    - group: apps
      kind: Deployment
      name: harbor-registry
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
        - /spec/template/metadata/annotations/checksum~1secret-core
        - /spec/template/metadata/annotations/checksum~1secret-jobservice
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        role: infra
