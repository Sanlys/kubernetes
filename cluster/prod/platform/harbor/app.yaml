apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.19.2
      helm:
        valueFiles:
          - $values/cluster/prod/platform/harbor/values.yaml
    - repoURL: https://github.com/Sanlys/kubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  # volumeClaimTemplates[].metadata.creationTimestamp is a known Kubernetes
  # JSON-marshaling quirk (metav1.Time's MarshalJSON emits "null" for a zero
  # value regardless of omitempty) on nested embedded objects; the chart
  # never declares it, so it's a permanent phantom diff, not real drift.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: harbor-redis
      jsonPointers:
        - /spec/volumeClaimTemplates/0/metadata/creationTimestamp
    - group: apps
      kind: StatefulSet
      name: harbor-database
      jsonPointers:
        - /spec/volumeClaimTemplates/0/metadata/creationTimestamp
    - group: apps
      kind: StatefulSet
      name: harbor-trivy
      jsonPointers:
        - /spec/volumeClaimTemplates/0/metadata/creationTimestamp
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        role: infra
