expose:
  # Native Gateway API output - harbor.k8s.lysakermoen.com doesn't match
  # either wildcard (two labels before lysakermoen.com, so not
  # *.lysakermoen.com; the internal wildcard would match but this needs to
  # stay reachable on the public IP), so it gets its own listener on
  # traefik-public's Gateway instead - see that Gateway's "harbor" listener.
  type: route
  # Chart default (enabled: true, certSource: auto) generates a CA-download
  # volume whose templating breaks when combined with expose.type: route -
  # "may not specify more than 1 volume type" on harbor-core's Deployment.
  # Moot anyway: Traefik's Gateway listener terminates TLS now, so Harbor
  # itself never needs to know about a cert.
  tls:
    enabled: false
  route:
    hosts:
      - harbor.k8s.lysakermoen.com
    parentRefs:
      - name: traefik-public-gateway
        namespace: traefik-public
        sectionName: harbor
        group: gateway.networking.k8s.io
        kind: Gateway

externalURL: https://harbor.k8s.lysakermoen.com

notary:
  enabled: false
chartmuseum:
  enabled: true
trivy:
  enabled: true

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany
      size: 10Gi
    chartmuseum:
      storageClass: rook-ceph-block-ssd
      size: 5Gi
    jobservice:
      jobLog:
        storageClass: ceph-filesystem
        accessMode: ReadWriteMany
        size: 5Gi
    database:
      storageClass: rook-ceph-block-ssd
      size: 10Gi
    redis:
      storageClass: rook-ceph-block-ssd
      size: 2Gi
    trivy:
      storageClass: rook-ceph-block-ssd
      size: 10Gi

metrics:
  enabled: true