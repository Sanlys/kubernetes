# No device filter - this fleet mixes NVMe (ssd), SATA (hdd) and one
# USB-attached SATA disk (talos-zr9-r2s's osd.3, behind an ASMedia
# 174c:55aa bridge - confirmed live that smartctl's SAT passthrough works
# fine through it, full attribute table and overall-health both read
# cleanly). Leaving config empty lets the exporter auto-detect whatever
# block devices actually exist on each node instead of hand-listing them
# per node.
config: {}

serviceMonitor:
  enabled: true

# Same deal as prometheus-blackbox-exporter's rules: Prometheus's
# ruleSelector only picks up PrometheusRules labelled release=monitoring
# (kube-prometheus-stack's Helm-generated default) - without this label
# the chart's own bundled rules below get created but never loaded.
prometheusRules:
  enabled: true
  extraLabels:
    release: monitoring
  rules:
    # Chart default is a flat >60C for every device, which is wrong in
    # both directions here: this fleet's boot SSDs/NVMe run into the 60s
    # routinely with nothing wrong (confirmed live - the Toshiba one on
    # talos-3gd-ovr sits at 64C with a SMART temperature THRESH of 0,
    # i.e. the drive itself has never once flagged this), while a
    # spinning HDD hitting 60C (osd.3's normal range is ~46C) is a real
    # "do something" signal - HDD failure rates climb measurably above
    # ~50C. smartctl_device_rotation_rate only exists at all for actual
    # rotational disks (confirmed live - present for the 4 HDDs, absent
    # - not zero - for every SSD/NVMe), so it doubles as the type split.
    smartCTLDDeviceTemperature:
      expr: >-
        (smartctl_device_temperature{temperature_type="current"} > 55 and on(instance, device) smartctl_device_rotation_rate)
        or
        (smartctl_device_temperature{temperature_type="current"} > 72 unless on(instance, device) smartctl_device_rotation_rate)
      annotations:
        summary: Device is running hotter than its type's safe threshold
        description: Device {{ $labels.device }} on instance {{ $labels.instance }} is at {{ $value }}°C (threshold 55C for HDDs, 72C for SSD/NVMe).

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 64Mi

# The chart's only RBAC resource binds the ServiceAccount to a
# ClusterRole named "unrestricted-psp" - leftover PodSecurityPolicy
# machinery from before PSP was removed in Kubernetes 1.25. That
# ClusterRole doesn't exist here (confirmed), so the binding would just
# be a dangling no-op; disabling it avoids committing a reference to a
# resource that was never going to exist.
rbac:
  create: false
