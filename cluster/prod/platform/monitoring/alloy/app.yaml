apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.1
      helm:
        valueFiles:
          - $values/cluster/prod/platform/monitoring/alloy/values.yaml
    - repoURL: https://github.com/Sanlys/kubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Gateway API's ParentReference group+kind default server-side when
  # omitted; our manifest omits them, so this is a permanent phantom diff,
  # not real drift - same issue as traefik-internal's own Gateway/HTTPRoute.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: alloy
      jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
