alloy:
  # Was false - meant every one of the 6 DaemonSet replicas independently
  # tailed and forwarded ALL ~580 containers cluster-wide via
  # loki.source.kubernetes (the Kubernetes-API tailing method doesn't
  # naturally shard by node the way file-based tailing would), so every
  # log line in Loki was being stored 6x over. Needed as a real
  # correctness fix anyway - without it the mirror pipeline's derived
  # Prometheus counters below would be inflated 6x (once per replica).
  # Each loki.source.kubernetes block also needs its own
  # `clustering { enabled = true }` to actually participate.
  clustering:
    enabled: true
  mounts:
    extra:
      - name: geoip-db
        # Separate top-level path, not nested under /etc/alloy (where
        # the config ConfigMap mounts) - avoids any ambiguity from
        # layering two unrelated volume mounts on top of each other.
        mountPath: /var/lib/alloy-geoip
        readOnly: true
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // mirror's own dedicated pipeline below also forwards everything
        // it keeps to loki.write - without this, every mirror log line
        // was being stored twice (once raw here, once processed there),
        // silently doubling any Loki query result for that namespace.
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "drop"
          regex         = "mirror"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
          action        = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
          action        = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
          action        = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
          action        = "replace"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.loki.receiver]
        clustering {
          enabled = true
        }
      }

      loki.source.kubernetes_events "events" {
        job_name   = "kubernetes-events"
        log_format = "logfmt"
        forward_to = [loki.write.loki.receiver]
      }

      // --- mirror analytics (cluster/prod/apps/mirror) ---
      // Two separate pipelines in the "mirror" namespace: the nginx
      // container's JSON access logs (requests/bandwidth/GeoIP), and the
      // mirror-sync CronJob's logs (sync freshness). Kept apart from the
      // generic pod_logs pipeline above so GeoIP/metrics processing only
      // ever runs against this one app's logs, not all 580 containers.

      discovery.kubernetes "mirror_pods" {
        role = "pod"
        namespaces {
          names = ["mirror"]
        }
      }

      discovery.relabel "mirror_nginx" {
        targets = discovery.kubernetes.mirror_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "keep"
          regex         = "mirror"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "mirror_nginx_logs" {
        targets    = discovery.relabel.mirror_nginx.output
        forward_to = [loki.process.mirror_nginx.receiver]
        clustering {
          enabled = true
        }
      }

      loki.process "mirror_nginx" {
        // drop_malformed: nginx's own startup banner line ("Configuration
        // complete; ready for start up") isn't JSON - without this it was
        // flowing through with no status/bytes extracted, showing up as
        // an unlabeled "requests_total" series and polluting the status
        // breakdown with an empty-status slice.
        stage.json {
          expressions = {
            remote_addr     = "remote_addr",
            request_uri     = "request_uri",
            status          = "status",
            body_bytes_sent = "body_bytes_sent",
            http_user_agent = "http_user_agent",
          }
          drop_malformed = true
        }

        // kube-probe hits nginx directly every 10-20s (readiness/liveness,
        // bypassing Traefik entirely) and Blackbox-Exporter probes several
        // mirror targets every ~30s - neither is a real visitor, and
        // together they were the majority of what "Total Requests" was
        // actually counting. user_agent is promoted only long enough to
        // match on, then dropped again below so it never becomes a
        // Prometheus label (unbounded cardinality risk otherwise).
        stage.labels {
          values = {
            http_user_agent = "",
          }
        }

        stage.match {
          selector             = "{http_user_agent=~\".*kube-probe.*|.*Blackbox-Exporter.*\"}"
          action               = "drop"
          drop_counter_reason  = "synthetic_monitoring"
        }

        stage.label_drop {
          values = ["http_user_agent"]
        }

        stage.geoip {
          source  = "remote_addr"
          db      = "/var/lib/alloy-geoip/dbip-country-lite.mmdb"
          db_type = "country"
        }

        // Promoted to real Loki labels so the metrics below (which inherit
        // their label set from active Loki labels, not raw extracted
        // values) can be dimensioned by country/status. Bounded
        // cardinality: ~250 countries x ~15 realistic status codes.
        // geoip_country_name rides along from the same lookup (db_type
        // "country" already returns it for free) - kept alongside the code
        // rather than instead of it: the code is what the dashboard's
        // geomap panels match against Grafana's built-in gazetteer, the
        // name is what the table panels display instead of a 2-letter code.
        stage.labels {
          values = {
            status              = "",
            geoip_country_code  = "",
            geoip_country_name  = "",
          }
        }

        stage.metrics {
          // Alloy prepends "loki_process_custom_" by default - documented
          // default is that literal string, and prefix = "" does NOT
          // override it back to empty (confirmed live: set it, redeployed
          // with a full pod restart, name didn't change). Not fighting an
          // undocumented quirk - the real exposed names are
          // loki_process_custom_mirror_requests_total /
          // loki_process_custom_mirror_bytes_total, and the dashboard
          // queries against those, not the plain names.
          metric.counter {
            name        = "mirror_requests_total"
            description = "Total requests served by the archlinux mirror"
            match_all   = true
            action      = "inc"
          }

          metric.counter {
            name        = "mirror_bytes_total"
            description = "Total response bytes served by the archlinux mirror"
            source      = "body_bytes_sent"
            action      = "add"
          }
        }

        forward_to = [loki.write.loki.receiver]
      }

      discovery.relabel "mirror_sync" {
        targets = discovery.kubernetes.mirror_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "keep"
          regex         = "mirror-sync"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "mirror_sync_logs" {
        targets    = discovery.relabel.mirror_sync.output
        forward_to = [loki.process.mirror_sync.receiver]
        clustering {
          enabled = true
        }
      }

      loki.process "mirror_sync" {
        // mirror.sh echoes this marker line (see
        // cluster/prod/apps/mirror/mirror-script.yaml) on every
        // successful run, whether or not an actual rsync happened.
        stage.regex {
          expression = "MIRROR_LASTSYNC_EPOCH=(?P<epoch>\\d+)"
        }

        stage.metrics {
          metric.gauge {
            name        = "mirror_lastsync_epoch_seconds"
            description = "Unix timestamp of the mirror's own lastsync file as of the last successful sync run"
            source      = "epoch"
            action      = "set"
          }
        }

        forward_to = [loki.write.loki.receiver]
      }

ingress:
  enabled: false

# Was never scraped at all - confirmed live, zero "alloy" job in
# Prometheus despite the mirror pipeline correctly generating
# loki_process_custom_mirror_* metrics on Alloy's own /metrics the whole
# time. Needed for the dashboard (and anything else derived via
# stage.metrics) to actually reach Prometheus.
serviceMonitor:
  enabled: true

controller:
  volumes:
    extra:
      - name: geoip-db
        persistentVolumeClaim:
          claimName: geoip-db

extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: alloy
    spec:
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
          sectionName: websecure
      hostnames: ["alloy.k8s.lysakermoen.com"]
      rules:
        - backendRefs:
            - name: alloy
              port: 12345
