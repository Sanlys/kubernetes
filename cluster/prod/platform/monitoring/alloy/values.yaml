alloy:
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
          action        = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
          action        = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
          action        = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
          action        = "replace"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.loki.receiver]
      }
      
      loki.source.kubernetes_events "events" {
        job_name   = "kubernetes-events"
        log_format = "logfmt"
        forward_to = [loki.write.loki.receiver]
      }

      // eBPF auto-instrumentation: a server span for every HTTP/gRPC request an
      // app handles, plus its outgoing HTTP/SQL/Redis calls, without changing
      // the app. Each Alloy pod instruments the processes on its own node.
      beyla.ebpf "apps" {
        // TEMPORARY: log every span Beyla captures, to find why none reach Tempo.
        // Remove once traces show up.
        trace_printer = "text"

        // Keep the set of processes small. Beyla attaches to each one in turn, and
        // when attaching takes over 20s its pipeline panics and takes Alloy down.
        // Instrumenting every process (Ceph daemons, CSI sidecars, a new process
        // per Postgres connection) did exactly that.
        discovery {
          // Only processes that listen on a port, i.e. servers
          instrument {
            open_ports = "1-65535"
            kubernetes {
              namespace = "*"
            }
          }
          // Platform pieces, storage, and apps that already send their own traces
          exclude_instrument {
            kubernetes {
              namespace = "{kube-system,monitoring,traefik,argocd,cert-manager,cnpg-system,database,rook-ceph,harbor,kubevirt,kyverno,local-path-storage,metallb-system,tekton*,snapshots,windows11-vm,frpc,ingress-internal,ingress-public}"
            }
          }
          // Databases fork a process per connection; app-side SQL client spans still show the queries
          exclude_instrument {
            exe_path = "{*postgres*,*mariadb*,*mysqld*,*redis-server*,*valkey-server*}"
          }
        }

        ebpf {
          // Read the traceparent Traefik sends, so the app's span joins Traefik's trace
          track_request_headers = true
        }

        attributes {
          kubernetes {
            enable = "true"
          }
        }

        // Default sampler (parent-based, always on). parentbased_always_off
        // produced no app spans, likely because Beyla only reads the start of a
        // request and misses traceparent behind large headers and cookies.
        // Probe paths are dropped instead to keep the noise down.
        routes {
          unmatched        = "heuristic"
          ignore_mode      = "traces"
          ignored_patterns = [
            "/health", "/healthz", "/livez", "/readyz", "/ping", "/metrics",
            "/api/health", "/rest/noauth/health", "/-/healthy", "/-/ready",
          ]
        }

        output {
          traces = [otelcol.processor.batch.traces.input]
        }
      }

      otelcol.processor.batch "traces" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

  # beyla.ebpf loads eBPF programs and has to see every process on the node
  securityContext:
    privileged: true
    runAsUser: 0
    runAsGroup: 0

controller:
  hostPID: true

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-internal
  ingressClassName: internal
  # The chart defaults to the Faro receiver port (12347), which the Service doesn't expose; point at the UI instead
  faroPort: 12345
  hosts:
   - alloy.k8s.lysakermoen.com
  tls:
    - secretName: alloy-internal-tls
      hosts:
        - alloy.k8s.lysakermoen.com
