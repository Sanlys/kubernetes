# DB-IP's free City-Lite database (CC-BY 4.0, .mmdb format, same binary
# format MaxMind uses - no account/license key needed, unlike MaxMind's own
# GeoLite2, which started requiring signup). City-Lite includes every
# country-level field Country-Lite did (used for the Top Countries tables)
# plus an approximate city centroid lat/lon (used for the traffic heatmap) -
# one lookup covers both, no need to carry two separate databases.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geoip-db
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: rook-cephfs
  resources:
    requests:
      # Was 200Mi, sized for country-only (~5MB uncompressed). City-Lite is
      # tens of MB, and the sync script briefly holds both the old file and
      # a full temp download at once - trivial against the ~47TB free in
      # the Ceph pool either way.
      storage: 512Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: geoip-db-sync-script
  namespace: monitoring
data:
  sync.sh: |
    set -eu
    apk add --no-cache curl >/dev/null
    DEST=/geoip/dbip-city-lite.mmdb
    TMP=/geoip/.dbip-city-lite.mmdb.tmp

    # DB-IP publishes a new file around the start of each month - this
    # month's release may not exist yet for the first day or two, so try
    # this month then fall back to last month. Plain POSIX arithmetic
    # rather than GNU date's relative-date parsing (-d "-1 month"), which
    # busybox's date (this image) doesn't support the same way.
    YEAR=$(date -u +%Y)
    MONTH=$((10#$(date -u +%m)))
    for OFFSET in 0 1; do
      M=$((MONTH - OFFSET))
      Y=$YEAR
      if [ "$M" -le 0 ]; then
        M=$((M + 12))
        Y=$((Y - 1))
      fi
      YM=$(printf "%04d-%02d" "$Y" "$M")
      URL="https://download.db-ip.com/free/dbip-city-lite-${YM}.mmdb.gz"
      echo "Trying $URL"
      if curl -fsSL "$URL" -o "${TMP}.gz"; then
        gunzip -f "${TMP}.gz"
        mv "$TMP" "$DEST"
        echo "Updated $DEST from $YM release"
        exit 0
      fi
      echo "Not found, trying previous month"
    done

    echo "Failed to download any recent dbip-city-lite release" >&2
    exit 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: geoip-db-sync
  namespace: monitoring
spec:
  # DB-IP releases monthly, early in the month - run a few days in to be
  # safe it's published.
  schedule: "0 6 5 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: alpine:3.24.2
              command: ["/bin/sh", "/script/sync.sh"]
              volumeMounts:
                - name: geoip
                  mountPath: /geoip
                - name: script
                  mountPath: /script
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits: { memory: "128Mi" }
          volumes:
            - name: geoip
              persistentVolumeClaim:
                claimName: geoip-db
            - name: script
              configMap:
                name: geoip-db-sync-script
                defaultMode: 0755
