apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.14.1
      helm:
        valueFiles:
          - $values/cluster/prod/platform/monitoring/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/Sanlys/kubernetes.git
      targetRevision: main
      ref: values
    # Just the alpha-2 countries.geojson ConfigMap (see extra/'s own
    # comment) - mounted into Grafana below via extraConfigmapMounts.
    # Separate directory source rather than inlining 250KB of JSON into
    # values.yaml's extraManifests list.
    - repoURL: https://github.com/Sanlys/kubernetes.git
      targetRevision: main
      path: cluster/prod/platform/monitoring/kube-prometheus-stack/extra
      directory: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Gateway API's ParentReference group+kind default server-side when
  # omitted; our manifest omits them, so this is a permanent phantom diff,
  # not real drift - same issue as traefik-internal's own Gateway/HTTPRoute.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prometheus
      jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
        - /spec/rules/0/matches
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: alertmanager
      jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
        - /spec/rules/0/matches
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
