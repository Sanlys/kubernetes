alertmanager:
  ingress:
    enabled: true
    ingressClassName: internal
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-internal
    hosts:
      - alertmanager.k8s.lysakermoen.com
    paths:
      - /
    tls:
      - secretName: alertmanager-k8s-lysakermoen-com
        hosts:
          - alertmanager.k8s.lysakermoen.com
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      routes:
        - matchers: [alertname="Watchdog"]
          receiver: 'null'
        - receiver: discord
    receivers:
      - name: discord
        webhook_configs:
          - url: "http://am-discord.monitoring.svc.cluster.local:9094/"
      - name: 'null'

kubeScheduler:
  enabled: true
  service:
    enabled: true
    selector:
      k8s-app: kube-scheduler
    port: 10259
    targetPort: 10259
    name: https-metrics
  serviceMonitor:
    enabled: true
    https: true
    insecureSkipVerify: true

kubeControllerManager:
  enabled: true
  service:
    enabled: true
    selector:
      k8s-app: kube-controller-manager
    port: 10257
    targetPort: 10257
    name: https-metrics
  serviceMonitor:
    enabled: true
    https: true
    insecureSkipVerify: true

kubeEtcd:
  enabled: true
  endpoints:
    - "10.0.6.69"
    - "10.0.6.102"
    - "10.0.6.126"
  service:
    enabled: true
    port: 2381
    targetPort: 2381
  serviceMonitor:
    enabled: true
    scheme: http
    path: /metrics

prometheus:
  ingress:
    enabled: true
    ingressClassName: internal
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-internal
    hosts:
      - prometheus.k8s.lysakermoen.com
    paths:
      - /
    tls:
      - secretName: prometheus-k8s-lysakermoen-com
        hosts:
          - prometheus.k8s.lysakermoen.com
  prometheusSpec:
    # Chart default is 10d. 17.06Gi used at 10d scales to ~53Gi of raw data
    # at 31d (retention time is the only input to TSDB size here - no
    # retentionSize cap); sized storage below for headroom on that, not on
    # the original 20Gi.
    retention: 31d
    # Query API spans. Sampling is parent-based, so only requests that arrive
    # with a sampled trace (through Traefik) are recorded.
    tracingConfig:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      clientType: grpc
      insecure: true
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-block-ssd
          volumeMode: Filesystem
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              # 20Gi was running at ~87% with only 10d retention and no size
              # cap - as more gets monitored the same window just keeps
              # eating more bytes, so a small bump just hits the same wall
              # again soon. Ceph has room to spare; size for real headroom
              # on the ~53Gi expected at the new 31d retention above.
              storage: 100Gi

grafana:
  # Without this the chart generates its own random admin-password Secret
  # on every render. ArgoCD's Helm integration does client-side `helm
  # template` (no --dry-run=server), so the chart's `lookup()` call that's
  # meant to preserve an existing secret across upgrades always returns
  # empty - meaning every sync (even unrelated ones, like a chart version
  # bump) silently resets the login. grafana-admin-secret.enc.yaml holds a
  # stable credential instead; applied out-of-band like this repo's other
  # secret.enc.yaml files (see syncthing-backups-restic's directory.exclude
  # for the pattern - this app has no git-path source to exclude it from).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    security:
      allow_embedding: true
    # Grafana's own spans (HTTP handlers, datasource queries) under Traefik's trace
    tracing.opentelemetry.otlp:
      address: tempo.monitoring.svc.cluster.local:4317
    tracing.opentelemetry:
      propagation: w3c
  sidecar:
    datasources:
      watchMethod: "SLEEP"
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      jsonData:
        maxLines: 1000
        # Turns the trace_id in Traefik's JSON access log into a link to the trace
        derivedFields:
          - name: trace_id
            matcherRegex: '"trace_id":"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
    - name: Dashboard1 # Required for ceph
      type: prometheus
      access: proxy
      url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090

kubeProxy:
  enabled: false
