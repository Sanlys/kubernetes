deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2025-11-09"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    # Was 168h (7d) - too short for monthly mirror analytics (unique
    # visitor counts need to query raw logs over the full window, bounded
    # by retention). Current usage is ~18.5GB at 7d, so 40d projects to
    # roughly ~105GB - PVC bumped below to 150Gi for headroom. Trivial
    # against the ~47TB free in the Ceph pool.
    retention_period: 960h
    # Separate from max_query_series below - this caps how wide a *time
    # range* a single query can span, regardless of cardinality. Default
    # is 721h (30d1h); confirmed live via Grafana's API that it rejects a
    # query once the selected range exceeds it. Our retention is 960h
    # (40d), so without raising this, picking anything past ~30 days in
    # the dashboard's time picker would hit this cap even though the data
    # is still retained and would otherwise be queryable. Matched to
    # retention_period so the full retained history is always in range.
    max_query_length: 960h
    # Was 500, then 5000 - the mirror dashboard's "Unique Visitors" and "Top
    # Requested Paths" panels do `count/sum by (remote_addr|request_uri)
    # (...)` over raw logs (neither is a Loki label, by design - unbounded
    # cardinality - so neither can be a Prometheus metric dimension). That
    # groupby needs one intermediate series per distinct value in range
    # *before* the outer aggregation collapses it, and 5000 wasn't enough
    # once the dashboard's range grew past a few days.
    #
    # approx_topk/approx_count_distinct would let these scale without a
    # series cap at all (count-min sketch / HyperLogLog instead of one
    # series per value) - see the shard_aggregations comment below for why
    # that's not usable yet. Until it is, raised this instead: unlike
    # retention (which keeps growing forever), these panels query a
    # *rolling* window, so cardinality converges to a ceiling as old
    # entries age out rather than growing without bound - the earlier
    # "just keep raising it" concern was about unbounded growth, which
    # this isn't. Confirmed live before raising: remote_addr count went
    # 1d=1633 -> 3d=3875, visibly decelerating (not linear - visitors
    # recur across days), so a 30d linear extrapolation (~49k) would be a
    # large overestimate. 25000 gives real headroom over that without
    # guessing something extreme; re-measure via Grafana after this lands
    # and adjust if 30d actually comes in higher than expected.
    max_query_series: 25000
    # Was meant to let the "Top Requested Paths" panel use approx_topk
    # instead of plain topk(sum by (request_uri)...), which hits the same
    # max_query_series wall as Unique Visitors once the dashboard's range
    # grows (confirmed live: ~2.7k distinct request_uri values in just
    # 24h). approx_topk uses a count-min sketch instead of materializing
    # one series per path, so in theory it isn't bounded by
    # max_query_series at all.
    #
    # Left enabled but NOT currently used by the dashboard (reverted back
    # to plain topk - see ../grafana-dashboards/raw/mirror-analytics.json
    # panel id 22): confirmed live that approx_topk queries parsed fine
    # with this *unset*, but once set to include approx_topk here, the
    # exact same queries started failing with "parse error ... unexpected
    # IDENTIFIER" - the querier stops recognizing the function entirely,
    # the opposite of what enabling it should do. Reproduced across
    # several query shapes, ruled out a query-syntax mistake. Looks like a
    # real bug in this experimental/no-SLA feature on Loki 3.6.11
    # specifically. Revisit after a Loki version bump, or once
    # approx_count_distinct (same fix for Unique Visitors' remote_addr
    # cardinality) actually ships - confirmed live by grepping Loki's
    # parser grammar at every tagged release through v3.6.19/v3.7.9 (both
    # 2026-10-20): that function only exists on the unreleased main
    # branch, despite grafana.com's 2026-09-29 "what's new" post.
    shard_aggregations:
      - approx_topk
  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_delete_delay: 2h
    delete_request_store: filesystem
  # Enables the ruler so the mirror dashboard's unique-visitor recording
  # rules (../loki-mirror-rules/configmap.yaml) can run: each evaluation
  # re-queries only a cheap 1d window, not the dashboard's full range.
  # WAL/rule storage land on the existing singleBinary PVC (SingleBinary
  # mode runs the ruler in-process, no separate ruler PVC needed despite
  # the chart's ruler.persistence option existing for microservices mode).
  rulerConfig:
    enable_api: true
    storage:
      type: local
      # Must match sidecar.rules.folder below (chart default: /rules) - in
      # SingleBinary mode the chart's own `ruler.directories` values key
      # does nothing (confirmed live: the singlebinary statefulset template
      # never references it). Rule files only reach the pod via the
      # kiwigrid/k8s-sidecar container the chart enables by default
      # (sidecar.rules.enabled), which watches for ConfigMaps/Secrets
      # labeled loki_rule and syncs them into a writable emptyDir mounted
      # at this path - see ../loki-mirror-rules/configmap.yaml for the
      # actual rule content (separate Application: this one's own second
      # source is values-only, doesn't apply arbitrary manifests from its
      # directory). Pointing this at a path with no such mount (e.g.
      # /etc/loki/rules) crash-loops the pod: the container's root
      # filesystem is read-only, so Loki's own mkdir on startup fails.
      local:
        directory: /rules
    rule_path: /var/loki/ruler-rule-path
    ring:
      kvstore:
        store: inmemory
    remote_write:
      enabled: true
      clients:
        prometheus:
          url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: rook-ceph-block-ssd
    size: 150Gi

# Zero out all scalable/distributed components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
