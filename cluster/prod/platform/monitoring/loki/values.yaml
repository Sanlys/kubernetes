deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2025-11-09"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    # Was 168h (7d) - too short for monthly mirror analytics (unique
    # visitor counts need to query raw logs over the full window, bounded
    # by retention). Current usage is ~18.5GB at 7d, so 40d projects to
    # roughly ~105GB - PVC bumped below to 150Gi for headroom. Trivial
    # against the ~47TB free in the Ceph pool.
    retention_period: 960h
    # Was the 500 default - the mirror dashboard's "Unique Visitors" panels
    # do `count by (remote_addr) (...)` over raw logs (remote_addr isn't a
    # Loki label, by design - unbounded cardinality - so it can't be a
    # Prometheus metric dimension). That groupby needs one intermediate
    # series per distinct IP in range *before* the outer count() collapses
    # it to a single number, and real internet traffic produces more than
    # 500 distinct IPs over any useful time range. Confirmed live: the panel
    # errored with "maximum number of series (500) reached" only after the
    # FRP Proxy Protocol fix started letting real external IPs through.
    max_query_series: 5000
    # Lets the "Top Requested Paths" panel use approx_topk instead of a
    # plain topk(sum by (request_uri)...) - that plain version hit the same
    # max_query_series wall as Unique Visitors once the dashboard's range
    # grew (confirmed live: ~2.7k distinct request_uri values in just 24h,
    # so 30d blows well past 5000). approx_topk uses a count-min sketch
    # instead of materializing one series per path, so it isn't bounded by
    # max_query_series at all - true per-request_uri accuracy traded for an
    # approximation, but k=20 here is tiny next to the default
    # max_count_min_sketch_heap_size (10000), so the approximation error is
    # negligible regardless of how many distinct paths exist in range.
    # Experimental upstream (limited support, no SLA) - see
    # ../grafana-dashboards/raw/mirror-analytics.json panel id 22.
    #
    # approx_count_distinct (which would let Unique Visitors do the same
    # for remote_addr) is NOT available yet - confirmed live by grepping
    # Loki's parser grammar at every tagged release through v3.6.19/v3.7.9
    # (both 2026-10-20): the function only exists on the unreleased main
    # branch, despite grafana.com's 2026-09-29 "what's new" post. Revisit
    # once it actually ships in a tagged release.
    shard_aggregations:
      - approx_topk
  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_delete_delay: 2h
    delete_request_store: filesystem
  # Enables the ruler so the mirror dashboard's unique-visitor recording
  # rules (../loki-mirror-rules/configmap.yaml) can run: each evaluation
  # re-queries only a cheap 1d window, not the dashboard's full range.
  # WAL/rule storage land on the existing singleBinary PVC (SingleBinary
  # mode runs the ruler in-process, no separate ruler PVC needed despite
  # the chart's ruler.persistence option existing for microservices mode).
  rulerConfig:
    enable_api: true
    storage:
      type: local
      # Must match sidecar.rules.folder below (chart default: /rules) - in
      # SingleBinary mode the chart's own `ruler.directories` values key
      # does nothing (confirmed live: the singlebinary statefulset template
      # never references it). Rule files only reach the pod via the
      # kiwigrid/k8s-sidecar container the chart enables by default
      # (sidecar.rules.enabled), which watches for ConfigMaps/Secrets
      # labeled loki_rule and syncs them into a writable emptyDir mounted
      # at this path - see ../loki-mirror-rules/configmap.yaml for the
      # actual rule content (separate Application: this one's own second
      # source is values-only, doesn't apply arbitrary manifests from its
      # directory). Pointing this at a path with no such mount (e.g.
      # /etc/loki/rules) crash-loops the pod: the container's root
      # filesystem is read-only, so Loki's own mkdir on startup fails.
      local:
        directory: /rules
    rule_path: /var/loki/ruler-rule-path
    ring:
      kvstore:
        store: inmemory
    remote_write:
      enabled: true
      clients:
        prometheus:
          url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: rook-ceph-block-ssd
    size: 150Gi

# Zero out all scalable/distributed components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
