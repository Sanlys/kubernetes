deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2025-11-09"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    # Was 168h (7d) - too short for monthly mirror analytics (unique
    # visitor counts need to query raw logs over the full window, bounded
    # by retention). Current usage is ~18.5GB at 7d, so 40d projects to
    # roughly ~105GB - PVC bumped below to 150Gi for headroom. Trivial
    # against the ~47TB free in the Ceph pool.
    retention_period: 960h
    # Was the 500 default - the mirror dashboard's "Unique Visitors" panels
    # do `count by (remote_addr) (...)` over raw logs (remote_addr isn't a
    # Loki label, by design - unbounded cardinality - so it can't be a
    # Prometheus metric dimension). That groupby needs one intermediate
    # series per distinct IP in range *before* the outer count() collapses
    # it to a single number, and real internet traffic produces more than
    # 500 distinct IPs over any useful time range. Confirmed live: the panel
    # errored with "maximum number of series (500) reached" only after the
    # FRP Proxy Protocol fix started letting real external IPs through.
    max_query_series: 5000
  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_delete_delay: 2h
    delete_request_store: filesystem
  # The "unique visitors" recording rules below need to re-query raw logs
  # too, but only over a cheap 1d window each evaluation (not the
  # dashboard's full range) - see ruler.directories below for why this
  # exists. WAL/rule storage both land on the existing singleBinary PVC
  # (SingleBinary mode runs the ruler in-process, no separate ruler PVC
  # needed despite the chart's ruler.persistence option existing for
  # microservices mode).
  rulerConfig:
    enable_api: true
    storage:
      type: local
      local:
        directory: /etc/loki/rules
    rule_path: /var/loki/ruler-rule-path
    ring:
      kvstore:
        store: inmemory
    remote_write:
      enabled: true
      clients:
        prometheus:
          url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: rook-ceph-block-ssd
    size: 150Gi

# Zero out all scalable/distributed components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

ruler:
  # "fake" is Loki's fixed internal tenant ID when auth_enabled is false -
  # not a placeholder to fill in, this is the actual required key.
  directories:
    fake:
      mirror-unique-visitors.yaml: |
        groups:
          - name: mirror-unique-visitors
            # Each evaluation re-queries only the trailing 1d window (cheap,
            # nowhere near max_query_series), not the dashboard's selected
            # range - the dashboard panels below just graph these resulting
            # Prometheus metrics instead of re-scanning raw logs over 30d.
            interval: 1h
            rules:
              - record: mirror:unique_visitors:1d
                expr: |
                  count(count by (remote_addr) (count_over_time({namespace="mirror", container="mirror"} | json | __error__="" [1d])))
              - record: mirror:unique_visitors_by_country:1d
                expr: |
                  count by (geoip_country_code) (count by (geoip_country_code, remote_addr) (count_over_time({namespace="mirror", container="mirror", geoip_country_code!=""} | json | __error__="" [1d])))
