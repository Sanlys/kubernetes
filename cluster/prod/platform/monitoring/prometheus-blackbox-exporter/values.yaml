# Bare-hostname probes against the Traefik default backend: no route
# matches the apex/k8s hostnames, so a healthy ingress answers 404 with
# TRAEFIK DEFAULT CERT. Anything else (timeout, refused) means the path
# to that Traefik is broken.
config:
  modules:
    http_traefik_default_404:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [404]
        follow_redirects: false
        preferred_ip_protocol: "ip4"
        tls_config:
          insecure_skip_verify: true

# Was already collecting probe_success for every target below with
# nothing ever alerting on it - Grafana showed it, nobody got paged.
prometheusRule:
  enabled: true
  # Prometheus' ruleSelector only picks up rules labelled release=monitoring -
  # without this the rules below were never loaded, so the 2026-10-30 frps
  # outage went unalerted despite the *-external probes reading 0.
  additionalLabels:
    release: monitoring
  rules:
    # Fast-path for losing the ingress entirely (e.g. the frps VPS hanging):
    # 15s probes, so 1m is ~4 consecutive failures.
    - alert: IngressUnreachable
      expr: probe_success{target=~"ingress-.*"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Ingress unreachable: {{ $labels.target }}"
        description: "Traefik default-backend probe {{ $labels.target }} ({{ $labels.instance }}) has been failing for over 1 minute. For ingress-public-external this usually means the frps VPS or the frpc tunnel is down."
    - alert: ProbeFailed
      expr: probe_success{target!~"ingress-.*"} == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Blackbox probe failed for {{ $labels.target }}"
        description: "Synthetic HTTP(S) check against {{ $labels.instance }} (target {{ $labels.target }}) has been failing for more than 5 minutes."
    # blackbox_exporter emits this for every HTTPS probe automatically -
    # a cross-check independent of cert-manager's own metrics (catches a
    # cert that renewed in the Secret but never actually got served, not
    # just cert-manager's view of its own Certificate objects).
    - alert: ProbeTLSCertExpiringSoon
      expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "TLS cert for {{ $labels.target }} expires in less than 14 days"
        description: "The certificate served at {{ $labels.instance }} (target {{ $labels.target }}) expires in under 14 days."
serviceMonitor:
  enabled: true
  selfMonitor:
    enabled: true
  targets:
    # Pinned to explicit IPs on purpose: on the LAN lysakermoen.com resolves
    # to traefik-public directly, which would never notice the VPS/frp path
    # being down. hostname sets Host/SNI while the connection goes to the IP.
    - name: "ingress-public-external"
      url: https://79.76.33.72
      hostname: lysakermoen.com
      module: http_traefik_default_404
      interval: 15s
      scrapeTimeout: 10s
    # Home WAN IP -> router port forward -> traefik-public, i.e. the path
    # public DNS points at now. Works from inside the LAN only because the
    # router does NAT loopback.
    - name: "ingress-public-home"
      url: https://62.141.128.169
      hostname: lysakermoen.com
      module: http_traefik_default_404
      interval: 15s
      scrapeTimeout: 10s
    - name: "ingress-public-local"
      url: https://10.0.6.241
      hostname: lysakermoen.com
      module: http_traefik_default_404
      interval: 15s
      scrapeTimeout: 10s
    - name: "ingress-internal"
      url: https://10.0.6.240
      hostname: k8s.lysakermoen.com
      module: http_traefik_default_404
      interval: 15s
      scrapeTimeout: 10s
    - name: "vaultwarden-external"
