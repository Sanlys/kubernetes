apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-internal
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: ["grafana.k8s.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: monitoring-grafana
          port: 80
