apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tools-idp-postgres
  namespace: tools-idp
  labels:
    app.kubernetes.io/managed-by: vpa-policy-generator
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tools-idp-postgres
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
      - containerName: postgres
        minAllowed:
          cpu: 50m
          memory: 128Mi
        maxAllowed:
          cpu: "2"
          memory: 4Gi
        controlledValues: RequestsAndLimits
