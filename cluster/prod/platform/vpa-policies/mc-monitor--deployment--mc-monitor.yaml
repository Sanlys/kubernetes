apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: mc-monitor
  namespace: mc-monitor
  labels:
    app.kubernetes.io/managed-by: vpa-policy-generator
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mc-monitor
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
      - containerName: mc-monitor
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: "2"
          memory: 2Gi
        controlledValues: RequestsAndLimits
