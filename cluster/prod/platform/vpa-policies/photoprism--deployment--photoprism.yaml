apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: photoprism
  namespace: photoprism
  labels:
    app.kubernetes.io/managed-by: vpa-policy-generator
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: photoprism
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: photoprism
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: "2"
          memory: 2Gi
        controlledValues: RequestsAndLimits
