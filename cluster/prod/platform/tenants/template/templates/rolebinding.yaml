apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-access
  namespace: tenant-{{ .Values.tenantName }}
subjects:
  - kind: ServiceAccount
    name: tenant-{{ .Values.tenantName }}
    namespace: tenant-{{ .Values.tenantName }}
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
