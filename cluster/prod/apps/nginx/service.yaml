apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx
  labels: { app: nginx }
spec:
  # Was type: LoadBalancer with its own IP, predating the HTTPRoutes in
  # ingresses.yaml - dead weight once Traefik took over routing.
  selector: { app: nginx }
  ports:
    - name: http
      port: 80
      targetPort: http

