apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trilium-mcp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sanlys/kubernetes.git
    targetRevision: main
    path: cluster/prod/apps/trilium-mcp
    directory:
      exclude: "{app.yaml,secret.enc.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: trilium-mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
