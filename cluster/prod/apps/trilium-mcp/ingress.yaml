apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trilium-mcp
  namespace: trilium-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-public
    # MCP's StreamableHTTP transport holds long-lived streaming
    # connections (GET /mcp), same reasoning as SSE - buffering or a
    # short read timeout breaks the stream.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: public
  tls:
    - hosts: [ "trilium-mcp.lysakermoen.com" ]
      secretName: trilium-mcp-tls
  rules:
    - host: trilium-mcp.lysakermoen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trilium-mcp
                port:
                  number: 8080
