apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-internal
  namespace: nginx-custom-image
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: ["nginx-custom.k8s.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: nginx-from-harbor
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-public
  namespace: nginx-custom-image
spec:
  parentRefs:
    - name: traefik-public-gateway
      namespace: traefik-public
      sectionName: websecure
  hostnames: ["nginx-custom.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: nginx-from-harbor
          port: 80