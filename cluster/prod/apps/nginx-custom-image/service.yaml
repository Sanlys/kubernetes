apiVersion: v1
kind: Service
metadata:
  name: nginx-from-harbor
  namespace: nginx-custom-image
  labels: { app: nginx-from-harbor }
spec:
  # Was type: LoadBalancer with its own IP, predating the HTTPRoutes in
  # ingresses.yaml - dead weight once Traefik took over routing.
  selector: { app: nginx-from-harbor }
  ports:
    - name: http
      port: 80
      targetPort: http