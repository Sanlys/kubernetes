apiVersion: apps/v1
kind: Deployment
metadata:
  name: filestash
  namespace: filestash
  labels: { app: filestash }
spec:
  replicas: 1
  # RollingUpdate's default maxSurge would schedule a second pod (possibly on
  # another node) before killing the old one - fatal for the RWO
  # filestash-data PVC (Multi-Attach error).
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: filestash }
  template:
    metadata:
      labels: { app: filestash }
    spec:
      # machines/filestash only mkdir's /app/data/state/ itself - the log/
      # config/plugin/db subdirectories underneath it are populated by the
      # app at first run, baked into the image's own filesystem layer.
      # Mounting an empty PVC straight onto /app/data/state hides all of
      # that from the main container, so Filestash crashes trying to open
      # its log file in a directory that (from its point of view) no
      # longer exists. Seed the PVC from the image's own pristine copy the
      # first time it's empty; once state/log exists, later restarts skip
      # this and keep whatever's actually been persisted (admin setup,
      # backend connections, plugins).
      initContainers:
        - name: seed-state
          image: machines/filestash:latest
          # Plain -r, not -a: -a also tries to copy the destination
          # directory's own timestamps, which needs ownership of the PVC
          # mount root itself (owned by root) - the container runs as the
          # image's non-root "filestash" user, so that utimensat() call is
          # rejected even though the file copies themselves succeed.
          command: ["sh", "-c", "test -d /mnt/state/log || cp -r /app/data/state/. /mnt/state/"]
          volumeMounts:
            - name: data
              mountPath: /mnt/state
      containers:
        - name: filestash
          image: machines/filestash:latest
          env:
            # Hostname only (no scheme/port) - Filestash derives https from
            # the ingress's X-Forwarded-Proto header.
            - name: APPLICATION_URL
              value: "filestash.lysakermoen.com"
          ports:
            - name: http
              containerPort: 8334
          volumeMounts:
            - name: data
              mountPath: /app/data/state
          readinessProbe:
            httpGet: { path: "/", port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: "/", port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits: { memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: filestash-data
