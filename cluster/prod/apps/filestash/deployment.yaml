apiVersion: apps/v1
kind: Deployment
metadata:
  name: filestash
  namespace: filestash
  labels: { app: filestash }
spec:
  replicas: 1
  # RollingUpdate's default maxSurge would schedule a second pod (possibly on
  # another node) before killing the old one - fatal for the RWO
  # filestash-data PVC (Multi-Attach error).
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: filestash }
  template:
    metadata:
      labels: { app: filestash }
    spec:
      # Filestash expects state/log to already exist (it opens a log file
      # there on startup but never MkdirAll's the directory itself, and
      # doesn't ship it pre-created in the image either). Guarantee it
      # explicitly, once, on a fresh PVC. A marker file (rather than
      # testing for state/log itself) gates the one-time seed so later
      # restarts don't re-copy over persisted state (admin setup, backend
      # connections, plugins).
      #
      # A freshly provisioned rook-ceph-block-ssd PVC's mount root is
      # root:root and not writable by the image's non-root "filestash"
      # user - only entries that already exist can be overwritten in
      # place, a brand new directory entry (mkdir) is rejected outright.
      # This is the one step that needs to actually create things there,
      # so it runs as root (nothing else - no privileged/hostPath, so no
      # namespace opt-in needed) and hands ownership back to filestash
      # afterwards so the non-root main container can use it.
      initContainers:
        - name: seed-state
          image: machines/filestash@sha256:95f8338bcc5d42c873a1fa95e99266aae324bded94fd4e5d9b826bb00dc45590
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          # Plain -r, not -a: -a also tries to copy the destination
          # directory's own timestamps, which needs ownership of the PVC
          # mount root itself - moot now that this runs as root, but kept
          # since attribute preservation still isn't needed for a one-time
          # seed of default state files.
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -e /mnt/state/.seeded ]; then
                cp -r /app/data/state/. /mnt/state/
                mkdir -p /mnt/state/log
                touch /mnt/state/.seeded
              fi
              chown -R filestash:filestash /mnt/state
          volumeMounts:
            - name: data
              mountPath: /mnt/state
      containers:
        - name: filestash
          image: machines/filestash@sha256:95f8338bcc5d42c873a1fa95e99266aae324bded94fd4e5d9b826bb00dc45590
          env:
            # Hostname only (no scheme/port) - Filestash derives https from
            # the ingress's X-Forwarded-Proto header.
            - name: APPLICATION_URL
              value: "filestash.lysakermoen.com"
          ports:
            - name: http
              containerPort: 8334
          volumeMounts:
            - name: data
              mountPath: /app/data/state
          readinessProbe:
            httpGet: { path: "/", port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: "/", port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits: { memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: filestash-data
