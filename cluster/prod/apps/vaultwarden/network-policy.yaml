# Lateral-movement baseline: deny everything by default, then allow back
# only what vaultwarden actually needs. Ingress comes solely from the two
# Traefik instances (it's routed both internally and publicly - see
# ingresses.yaml); nothing else in the cluster has a reason to reach it
# directly. Egress is DNS plus the open internet - vaultwarden itself
# doesn't talk to anything else in-cluster (SQLite, no DB dependency) -
# but the internet-except-cluster-ranges shape (rather than blocking
# egress outright) is what actually stops this from being a lateral-
# movement stepping stone, while not caring what the app legitimately
# reaches outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: vaultwarden
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-public
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: "0.0.0.0/0"
            except:
              # Pod CIDR and Service CIDR - excluding these from the
              # "allow to internet" rule is what denies egress to every
              # other pod/service in the cluster by default.
              - 10.244.0.0/16
              - 10.96.0.0/12
