apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels: { app: vaultwarden }
spec:
  replicas: 1
  selector:
    matchLabels: { app: vaultwarden }
  # Recreate, not RollingUpdate: the RWO PVC can only attach to one node, so a
  # surge pod landing elsewhere hits Multi-Attach and the rollout hangs.
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: vaultwarden }
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
          env:
            - name: DOMAIN
              value: "https://vaultwarden.lysakermoen.com"
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: "/alive", port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-pvc
      securityContext:
        runAsNonRoot: false 
