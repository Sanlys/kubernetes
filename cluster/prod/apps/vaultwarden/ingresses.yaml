apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden-internal
  namespace: vaultwarden
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: ["vaultwarden.k8s.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: vaultwarden
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden-public
  namespace: vaultwarden
spec:
  parentRefs:
    - name: traefik-public-gateway
      namespace: traefik-public
      sectionName: websecure
  hostnames: ["vaultwarden.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: vaultwarden
          port: 80