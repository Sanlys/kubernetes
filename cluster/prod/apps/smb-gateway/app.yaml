apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smb-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sanlys/kubernetes.git
    targetRevision: main
    path: cluster/prod/apps/smb-gateway
    directory:
      # The config and harbor-pull Secrets are sops-encrypted and applied by hand, like every
      # other secret here (see services/smb-gateway/README.md).
      exclude: "{app.yaml,config-secret.enc.yaml,harbor-pull-secret.enc.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: smb-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
