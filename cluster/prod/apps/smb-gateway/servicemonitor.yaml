apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smb-gateway
  namespace: smb-gateway
spec:
  selector:
    matchLabels:
      app: smb-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      # Scrapes ask every rclone instance and smbd for their stats.
      scrapeTimeout: 10s
