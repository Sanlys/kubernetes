apiVersion: apps/v1
kind: Deployment
metadata:
  name: smb-gateway
  namespace: smb-gateway
  labels: { app: smb-gateway }
spec:
  replicas: 1
  # RWO cache PVC, and SMB is stateful per client - never two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: smb-gateway }
  template:
    metadata:
      labels: { app: smb-gateway }
    spec:
      # Time for smbd to close, the kernel to flush to rclone and rclone to
      # finish in-flight uploads (anything left over stays in the cache PVC
      # and is uploaded on the next start).
      terminationGracePeriodSeconds: 120
      # This namespace needs its own copy of the harbor-pull dockerconfigjson
      # secret (same content as cluster/prod/apps/nginx-custom-image/secret.enc.yaml -
      # imagePullSecrets don't cross namespaces). Create+sops-encrypt it here
      # as harbor-pull-secret.enc.yaml out of band.
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: smb-gateway
          # Source: services/smb-gateway/ in this repo. Argo CD only
          # applies manifests, it doesn't build anything - build and push
          # this yourself, then point this at the real digest:
          #   docker build -t harbor.k8s.lysakermoen.com/library/smb-gateway:v0.1.0 services/smb-gateway
          #   docker push harbor.k8s.lysakermoen.com/library/smb-gateway:v0.1.0
          image: harbor.k8s.lysakermoen.com/library/smb-gateway:v0.1.6
          imagePullPolicy: IfNotPresent
          args: ["run"]
          # mount(2) for the loopback NFS mounts, /dev/fuse for FUSE.
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: Europe/Oslo
            # Spans to Tempo, like Traefik. Logs are JSON on stdout (Alloy
            # ships them to Loki; lines inside a trace carry trace_id) and
            # metrics are on :8090/metrics (servicemonitor.yaml).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            # debug adds every directory read and rclone's internals
            - name: SMBGW_LOG_LEVEL
              value: info
          ports:
            - name: smb
              containerPort: 445
            - name: http
              containerPort: 8090
          volumeMounts:
            - name: config
              mountPath: /etc/smb-gateway
              readOnly: true
            - name: cache
              mountPath: /cache
          readinessProbe:
            tcpSocket: { port: 445 }
            periodSeconds: 10
            failureThreshold: 3
          # Lists every mount with a timeout: a wedged backend makes the
          # container restart instead of hanging SMB clients forever.
          livenessProbe:
            exec:
              command: ["/usr/local/bin/smb-gateway", "health"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 25
            failureThreshold: 4
          startupProbe:
            exec:
              command: ["/usr/local/bin/smb-gateway", "health"]
            periodSeconds: 10
            timeoutSeconds: 25
            failureThreshold: 30
          resources:
            # rclone buffers (buffer-size x open files per mount) and
            # restic's in-memory repository index dominate.
            requests: { cpu: "250m", memory: "1Gi" }
            limits: { memory: "4Gi" }
      volumes:
        # Not subPath-mounted, so Secret updates reach the running pod: user
        # and share changes are applied live, mount changes restart it.
        - name: config
          secret:
            secretName: smb-gateway-config
        - name: cache
          persistentVolumeClaim:
            claimName: smb-gateway-cache
