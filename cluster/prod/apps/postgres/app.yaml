apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-central
  namespace: argocd
spec:
  project: default
  destination:
    namespace: database
    server: https://kubernetes.default.svc
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cluster
    targetRevision: 0.9.0
    helm:
      values: |
        type: postgresql
        mode: standalone
        backups:
          enabled: false

        databases:
          - name: database
            ensure: present
            owner: postgres

        cluster:
          instances: 3

          affinity:
            enablePodAntiAffinity: true
            topologyKey: kubernetes.io/hostname
            podAntiAffinityType: required

          monitoring:
            enabled: true
            podMonitor:
              enabled: true

          nodeSelector:
            cnpg-storage: "true"

          storage:
            size: 20Gi
            storageClass: cnpg-local
          walStorage:
            size: 1Gi
            storageClass: cnpg-local
          resources:
            limits:
              memory: 8Gi
            requests:
              memory: 8Gi
              cpu: '2'

        poolers:
          - name: rw
            type: rw
            instances: 1
            monitoring:
              enabled: true
              podMonitor:
                enabled: true
                relabelings:
                  - targetLabel: type
                    replacement: rw
          - name: ro
            type: ro
            instances: 3
            monitoring:
              enabled: true
              podMonitor:
                enabled: true
                relabelings:
                  - targetLabel: type
                    replacement: ro

  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Pooler
      managedFieldsManagers:
        - manager
    # relabelings[].action defaults to "replace" server-side; the chart's
    # rendered PodMonitor omits it, causing a perpetual phantom diff.
    - group: monitoring.coreos.com
      kind: PodMonitor
      name: cnpg-central-cluster-pooler-rw-podmonitor
      jsonPointers:
        - /spec/podMetricsEndpoints/0/relabelings/0/action
    - group: monitoring.coreos.com
      kind: PodMonitor
      name: cnpg-central-cluster-pooler-ro-podmonitor
      jsonPointers:
        - /spec/podMetricsEndpoints/0/relabelings/0/action

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

