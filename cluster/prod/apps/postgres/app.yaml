apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-central
  namespace: argocd
spec:
  project: default
  destination:
    namespace: database
    server: https://kubernetes.default.svc
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cluster
    targetRevision: 0.9.0
    helm:
      values: |
        type: postgresql
        mode: standalone
        backups:
          enabled: false

        databases:
          - name: database
            ensure: present
            owner: postgres

        cluster:
          instances: 3

          # Pinned instead of the chart default (the legacy rolling
          # postgresql:16 tag, frozen at 16.15 on Debian bullseye). The
          # cluster was initdb'd with C collation, so the move to bookworm's
          # glibc does not affect index ordering. Renovate keeps this current
          # within 16.x via the customManager in renovate.json.
          imageName: ghcr.io/cloudnative-pg/postgresql:16.16-system-bookworm@sha256:83525cc7988e0340d9cae6fc06543944fd83c4dbb6bee14609fab18ccd23f88b

          affinity:
            enablePodAntiAffinity: true
            topologyKey: kubernetes.io/hostname
            podAntiAffinityType: required
            # nodeSelector lives inside CNPG's AffinityConfiguration type
            # (spec.affinity.nodeSelector on the Cluster CR), not as a
            # sibling of affinity - it was never actually applied to the
            # live Cluster despite being declared here, because this
            # chart's values schema only exposes cluster.affinity as a
            # pass-through block and has no top-level cluster.nodeSelector
            # key at all. Confirmed by instance cluster-2's join pod
            # landing on talos-ly6-852, a node with no cnpg-storage label.
            nodeSelector:
              cnpg-storage: "true"

          monitoring:
            enabled: true
            podMonitor:
              enabled: true

          storage:
            size: 20Gi
            storageClass: cnpg-local
          walStorage:
            size: 1Gi
            storageClass: cnpg-local
          resources:
            limits:
              memory: 8Gi
            requests:
              memory: 8Gi
              cpu: '2'

        poolers:
          - name: rw
            type: rw
            instances: 1
            template:
              spec:
                containers:
                  # Pinned instead of the operator's built-in default (1.25.2
                  # on CNPG 1.30.1), which no file names and Renovate can't
                  # see. Tracked by the customManagers rule in renovate.json.
                  - name: pgbouncer
                    image: ghcr.io/cloudnative-pg/pgbouncer:1.26.1@sha256:9f648625e11f67f5171f1edd31648c7d02a1a4a5e1b8adf7d4a9db30dce8c22b
            monitoring:
              enabled: true
              podMonitor:
                enabled: true
                relabelings:
                  - targetLabel: type
                    replacement: rw
          - name: ro
            type: ro
            instances: 3
            template:
              spec:
                containers:
                  # Pinned instead of the operator's built-in default (1.25.2
                  # on CNPG 1.30.1), which no file names and Renovate can't
                  # see. Tracked by the customManagers rule in renovate.json.
                  - name: pgbouncer
                    image: ghcr.io/cloudnative-pg/pgbouncer:1.26.1@sha256:9f648625e11f67f5171f1edd31648c7d02a1a4a5e1b8adf7d4a9db30dce8c22b
            monitoring:
              enabled: true
              podMonitor:
                enabled: true
                relabelings:
                  - targetLabel: type
                    replacement: ro

  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Pooler
      managedFieldsManagers:
        - manager
    # relabelings[].action defaults to "replace" server-side; the chart's
    # rendered PodMonitor omits it, causing a perpetual phantom diff.
    - group: monitoring.coreos.com
      kind: PodMonitor
      name: cnpg-central-cluster-pooler-rw-podmonitor
      jsonPointers:
        - /spec/podMetricsEndpoints/0/relabelings/0/action
    - group: monitoring.coreos.com
      kind: PodMonitor
      name: cnpg-central-cluster-pooler-ro-podmonitor
      jsonPointers:
        - /spec/podMetricsEndpoints/0/relabelings/0/action

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

