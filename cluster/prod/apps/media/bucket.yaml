# Unlike immich (which reads syncthing's bucket cross-namespace via RBAC +
# a kubectl init container), this bucket is owned directly by apps in this
# namespace, so the generated Secret/ConfigMap (both named
# "media-library-bucket") can just be wired up with envFrom/secretRef -
# no cross-namespace RBAC dance needed.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  # Never let Argo CD prune/delete this claim: the StorageClass reclaim
  # policy is Delete, so losing the claim would destroy the data.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: media-library-bucket
  namespace: media
spec:
  bucketName: media-library
  storageClassName: rook-ceph-bucket
