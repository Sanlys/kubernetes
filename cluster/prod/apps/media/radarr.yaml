apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-block-ssd
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: media
spec:
  selector:
    app: radarr
  ports:
    - name: http
      port: 7878
      targetPort: 7878
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      initContainers:
        - name: copy-rclone-binary
          image: rclone/rclone:1.68
          command: ["sh", "-c", "cp \"$(command -v rclone)\" /shared-bin/rclone && chmod +x /shared-bin/rclone"]
          volumeMounts:
            - name: rclone-bin
              mountPath: /shared-bin
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:5.14.0
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Oslo"
          envFrom:
            - secretRef:
                name: media-library-bucket
            - configMapRef:
                name: media-library-bucket
          ports:
            - containerPort: 7878
              name: http
          # Read-only rclone mount: same reasoning as sonarr.yaml, but
          # tracking /media/movies. "Rename Movies" stays off so Radarr
          # never writes here and qbittorrent's seeding stays intact.
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: fuse-device
              mountPath: /dev/fuse
            - name: rclone-bin
              mountPath: /opt/rclone-bin
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    set -e
                    # linuxserver.io images are built on either Alpine or
                    # Ubuntu depending on the app - detect which.
                    if command -v apk >/dev/null 2>&1; then
                      apk add --no-cache fuse3
                    elif command -v apt-get >/dev/null 2>&1; then
                      export DEBIAN_FRONTEND=noninteractive
                      apt-get update -qq
                      apt-get install -y -qq --no-install-recommends fuse3
                    else
                      echo "no supported package manager (apk/apt-get) found" >&2
                      exit 1
                    fi
                    export RCLONE_CONFIG_CEPHBUCKET_TYPE=s3
                    export RCLONE_CONFIG_CEPHBUCKET_PROVIDER=Ceph
                    export RCLONE_CONFIG_CEPHBUCKET_ENV_AUTH=false
                    export RCLONE_CONFIG_CEPHBUCKET_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
                    export RCLONE_CONFIG_CEPHBUCKET_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
                    export RCLONE_CONFIG_CEPHBUCKET_ENDPOINT="http://$BUCKET_HOST:$BUCKET_PORT"
                    export RCLONE_CONFIG_CEPHBUCKET_REGION="$BUCKET_REGION"
                    mkdir -p /media
                    echo "user_allow_other" >> /etc/fuse.conf 2>/dev/null || true
                    umount -l /media 2>/dev/null || true
                    setsid /opt/rclone-bin/rclone mount "cephbucket:$BUCKET_NAME" /media \
                      --allow-other \
                      --read-only \
                      --vfs-cache-mode minimal \
                      --dir-cache-time 1h \
                      --uid 1000 --gid 1000 --umask 022 \
                      --log-level INFO \
                      > /proc/1/fd/1 2>/proc/1/fd/2 < /dev/null &
            preStop:
              exec:
                command: ["umount", "-l", "/media"]
          readinessProbe:
            httpGet:
              path: /
              port: 7878
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 7878
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits: { memory: "512Mi" }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: rclone-bin
          emptyDir: {}
