apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-block-ssd
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: 8096
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      initContainers:
        - name: copy-rclone-binary
          image: rclone/rclone:1.68
          command: ["sh", "-c", "cp \"$(command -v rclone)\" /shared-bin/rclone && chmod +x /shared-bin/rclone"]
          volumeMounts:
            - name: rclone-bin
              mountPath: /shared-bin
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.0-rc4
          env:
            - name: TZ
              value: "Europe/Oslo"
          envFrom:
            - secretRef:
                name: media-library-bucket
            - configMapRef:
                name: media-library-bucket
          ports:
            - containerPort: 8096
              name: http
          # vfs-cache-mode full (not immich-server's "minimal") -
          # "minimal" doesn't retain file data at all, so every read (even
          # of something just played) re-fetches from the bucket with no
          # local reuse. "full" engages rclone's chunked/read-ahead
          # fetcher for all reads, cached or not, which is what actually
          # fixes cold-start latency - a smaller vfs-read-chunk-size below
          # helps further by shrinking the first (probe) fetch.
          # vfs-fast-fingerprint skips a hash/modtime freshness check
          # against the bucket on every open - every playback spawns a
          # fresh ffmpeg process re-opening the file, so that check would
          # otherwise cost an extra round-trip on every single playback
          # start, not just the first.
          #
          # Bucket is exposed via a loopback NFS mount (rclone serve nfs +
          # mount -t nfs against 127.0.0.1), not FUSE (rclone mount).
          # Confirmed via direct A/B testing that rclone's FUSE transport
          # itself is pathologically slow to open() large files on this
          # cluster's nodes - tens of seconds blocked in open() before any
          # data is returned, independent of vfs-cache-mode and independent
          # of which network path reaches the bucket. rclone serve nfs and
          # plain `rclone cat` against the same backend from the same pod
          # did not show this at all. privileged is still needed for the
          # mount(2) syscall.
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: rclone-bin
              mountPath: /opt/rclone-bin
              readOnly: true
            - name: vfs-cache
              mountPath: /rclone-cache
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    set -e
                    # jellyfin/jellyfin is Debian-based, but detect apk vs
                    # apt-get anyway for consistency with the other apps in
                    # this namespace and in case that ever changes.
                    if command -v apk >/dev/null 2>&1; then
                      apk add --no-cache nfs-utils
                    elif command -v apt-get >/dev/null 2>&1; then
                      export DEBIAN_FRONTEND=noninteractive
                      apt-get update -qq
                      apt-get install -y -qq --no-install-recommends nfs-common
                    else
                      echo "no supported package manager (apk/apt-get) found" >&2
                      exit 1
                    fi
                    export RCLONE_CONFIG_CEPHBUCKET_TYPE=s3
                    export RCLONE_CONFIG_CEPHBUCKET_PROVIDER=Ceph
                    export RCLONE_CONFIG_CEPHBUCKET_ENV_AUTH=false
                    export RCLONE_CONFIG_CEPHBUCKET_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
                    export RCLONE_CONFIG_CEPHBUCKET_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
                    export RCLONE_CONFIG_CEPHBUCKET_ENDPOINT="http://$BUCKET_HOST:$BUCKET_PORT"
                    export RCLONE_CONFIG_CEPHBUCKET_REGION="$BUCKET_REGION"
                    mkdir -p /mnt/media
                    umount -l /mnt/media 2>/dev/null || true
                    # Loopback only (127.0.0.1) - never reachable off-pod.
                    # Fixed port on both the NFS and mountd side avoids
                    # needing rpcbind/portmapper for the MOUNT protocol.
                    setsid /opt/rclone-bin/rclone serve nfs "cephbucket:$BUCKET_NAME" \
                      --addr 127.0.0.1:2049 \
                      --vfs-cache-mode full \
                      --cache-dir /rclone-cache \
                      --vfs-cache-max-size 15G \
                      --vfs-cache-min-free-space 1G \
                      --vfs-cache-max-age 24h \
                      --vfs-read-chunk-size 32M \
                      --vfs-read-chunk-size-limit 1G \
                      --vfs-fast-fingerprint \
                      --buffer-size 32M \
                      --dir-cache-time 1h \
                      --uid 1000 --gid 1000 --umask 022 \
                      --log-level INFO \
                      > /proc/1/fd/1 2>/proc/1/fd/2 < /dev/null &
                    mounted=0
                    for i in $(seq 1 30); do
                      if mount -t nfs -o vers=3,tcp,port=2049,mountport=2049,soft,ro 127.0.0.1:/ /mnt/media 2>/dev/null; then
                        mounted=1
                        break
                      fi
                      sleep 1
                    done
                    [ "$mounted" -eq 1 ] || { echo "failed to mount rclone NFS export after 30s" >&2; exit 1; }
            preStop:
              exec:
                command: ["umount", "-l", "/mnt/media"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { memory: "2Gi" }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        # Node-local scratch, not a PVC: purely disposable rclone chunk
        # cache, no reason for it to survive a pod restart/reschedule.
        # sizeLimit is a hard backstop behind rclone's own
        # --vfs-cache-max-size.
        - name: vfs-cache
          emptyDir:
            sizeLimit: 20Gi
        - name: rclone-bin
          emptyDir: {}
