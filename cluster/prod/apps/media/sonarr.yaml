apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-block-ssd
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: media
spec:
  selector:
    app: sonarr
  ports:
    - name: http
      port: 8989
      targetPort: 8989
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      initContainers:
        - name: copy-rclone-binary
          image: rclone/rclone:1.68
          command: ["sh", "-c", "cp \"$(command -v rclone)\" /shared-bin/rclone && chmod +x /shared-bin/rclone"]
          volumeMounts:
            - name: rclone-bin
              mountPath: /shared-bin
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.9
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Oslo"
          envFrom:
            - secretRef:
                name: media-library-bucket
            - configMapRef:
                name: media-library-bucket
          ports:
            - containerPort: 8989
              name: http
          # Sonarr refuses to accept a root folder that isn't writable (it
          # validates this even though it never actually writes here) - so
          # this can't be --read-only despite Sonarr only needing to see
          # what's under /mnt/media/tv to track have/missing episodes.
          # "Rename Episodes" stays off in Sonarr's Media Management
          # settings and Completed Download Handling stays off too, so it
          # never actually imports/moves/renames files in practice -
          # qbittorrent's seeding reference to the file (written directly
          # by qbittorrent's own mount, same bucket) is never disturbed.
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: fuse-device
              mountPath: /dev/fuse
            - name: rclone-bin
              mountPath: /opt/rclone-bin
              readOnly: true
            - name: dl
              mountPath: /dl
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    set -e
                    # linuxserver.io images are built on either Alpine or
                    # Ubuntu depending on the app - detect which.
                    if command -v apk >/dev/null 2>&1; then
                      apk add --no-cache fuse3
                    elif command -v apt-get >/dev/null 2>&1; then
                      export DEBIAN_FRONTEND=noninteractive
                      apt-get update -qq
                      apt-get install -y -qq --no-install-recommends fuse3
                    else
                      echo "no supported package manager (apk/apt-get) found" >&2
                      exit 1
                    fi
                    export RCLONE_CONFIG_CEPHBUCKET_TYPE=s3
                    export RCLONE_CONFIG_CEPHBUCKET_PROVIDER=Ceph
                    export RCLONE_CONFIG_CEPHBUCKET_ENV_AUTH=false
                    export RCLONE_CONFIG_CEPHBUCKET_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
                    export RCLONE_CONFIG_CEPHBUCKET_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
                    export RCLONE_CONFIG_CEPHBUCKET_ENDPOINT="http://$BUCKET_HOST:$BUCKET_PORT"
                    export RCLONE_CONFIG_CEPHBUCKET_REGION="$BUCKET_REGION"
                    mkdir -p /mnt/media
                    echo "user_allow_other" >> /etc/fuse.conf 2>/dev/null || true
                    umount -l /mnt/media 2>/dev/null || true
                    setsid /opt/rclone-bin/rclone mount "cephbucket:$BUCKET_NAME" /mnt/media \
                      --allow-other \
                      --vfs-cache-mode writes \
                      --dir-cache-time 1h \
                      --uid 1000 --gid 1000 --umask 022 \
                      --log-level INFO \
                      > /proc/1/fd/1 2>/proc/1/fd/2 < /dev/null &
            preStop:
              exec:
                command: ["umount", "-l", "/mnt/media"]
          readinessProbe:
            httpGet:
              path: /
              port: 8989
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 8989
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits: { memory: "512Mi" }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: rclone-bin
          emptyDir: {}
        - name: dl
          persistentVolumeClaim:
            claimName: qbittorrent-dl
