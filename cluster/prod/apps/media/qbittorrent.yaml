apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-custom-init
  namespace: media
data:
  # Runs via the linuxserver.io image's own custom-cont-init.d mechanism
  # (see "[custom-init] No custom files found, skipping..." in the
  # container's logs - this is what fills that in), which is guaranteed
  # by the image's own s6 init sequence to complete before
  # qbittorrent-nox starts. That ordering guarantee is the whole point:
  # our postStart hook runs concurrently with the container's entrypoint
  # with no such guarantee against qbittorrent-nox already having
  # started first.
  #
  # qbittorrent-nox treats a pre-existing IPC socket file at
  # /config/qBittorrent/ipc-socket as "another instance is already
  # running" and quits immediately and silently (clean exit, no error
  # logged) rather than checking whether anything is actually listening
  # on it. Unlike the PID-based lockfile (which the kernel effectively
  # invalidates once the owning process is gone), the socket is just a
  # file that survives on the /config PVC across restarts regardless of
  # how the previous process ended - an unclean shutdown (hard OOM, node
  # eviction, force-delete) leaves it behind and every subsequent start
  # bails out instantly against it.
  #
  # Unconditionally clearing both on every start is safe specifically
  # because this Deployment is replicas:1 with strategy:Recreate - the
  # previous pod is fully terminated (process gone, container gone)
  # before a new one is ever created, so there is structurally no
  # possibility of a live instance still holding either file when this
  # runs. Don't copy this pattern into a multi-replica or
  # RollingUpdate-strategy deployment without rethinking it.
  10-clear-stale-ipc.sh: |
    #!/usr/bin/with-contenv bash
    rm -f /config/qBittorrent/lockfile /config/qBittorrent/ipc-socket
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-block-ssd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-vfs-cache
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-block-ssd
  resources:
    requests:
      storage: 150Gi
---
# RWX (CephFS, not RBD block) - sonarr/radarr each run as their own
# separate pod and need to see this same real filesystem qbittorrent
# downloads into, not just the bucket they get copied/served to. See
# platform/rook-ceph/rook-ceph-fs for the backing CephFilesystem.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-dl
  namespace: media
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: rook-cephfs
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
spec:
  selector:
    app: qbittorrent
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
# gluetun's built-in HTTP proxy, so sonarr/radarr/prowlarr/bazarr (each
# their own pod, not sharing this pod's network namespace) can still send
# their outbound HTTPS traffic (indexers, trackers, subtitle providers)
# through the VPN tunnel, by pointing their own Settings -> proxy config
# at gluetun-proxy:8888. Sufficient for those apps since none of them
# speak raw torrent protocol - only qbittorrent needs full network-layer
# tunneling, which is why it's in this pod directly instead.
apiVersion: v1
kind: Service
metadata:
  name: gluetun-proxy
  namespace: media
spec:
  selector:
    app: qbittorrent
  ports:
    - name: http-proxy
      port: 8888
      targetPort: 8888
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  # RollingUpdate would schedule a second pod before killing the old one -
  # fatal for the RWO qbittorrent-config/qbittorrent-vfs-cache PVCs
  # (Multi-Attach error), same reasoning as immich-server.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      initContainers:
        # rclone binary is a static Go build, portable across distros - only
        # the NFS client packages (installed at postStart below) need to
        # come from the container's own distro. Same technique as
        # immich-server; see cluster/prod/apps/immich/server.yaml.
        - name: copy-rclone-binary
          image: rclone/rclone:1.68
          command: ["sh", "-c", "cp \"$(command -v rclone)\" /shared-bin/rclone && chmod +x /shared-bin/rclone"]
          volumeMounts:
            - name: rclone-bin
              mountPath: /shared-bin
        # nfs-utils used to be installed in qbittorrent's own postStart
        # hook, but that runs after gluetun (sharing this pod's network
        # namespace) starts, so it raced gluetun's kill-switch firewall
        # coming up and could hang the whole hook indefinitely. Worse,
        # once the tunnel was up, this pod's Mullvad exit (Switzerland)
        # turned out to silently drop SYNs to Alpine's mirror
        # infrastructure specifically (confirmed against two separate
        # mirrors; unrelated Fastly-hosted hosts like
        # raw.githubusercontent.com worked fine from the same exit) -
        # not something fixable from this side. Installing here instead
        # sidesteps it entirely: initContainers run before gluetun
        # starts, so this gets normal untunneled node/cluster networking.
        #
        # Installs into a throwaway root (--root/--initdb) rather than
        # this container's own filesystem, so apk resolves and installs
        # nfs-utils' full dependency set (libtirpc, keyutils, etc.) into
        # one self-contained tree that gets copied wholesale into the
        # shared volume below, instead of hand-picking binaries/libs.
        #
        # Pin this image's Alpine version to whatever the qbittorrent
        # image is actually built on (check `cat /etc/alpine-release`
        # inside it) if this drifts - mismatched libc/library versions
        # between the two trees is the main way this could break.
        - name: install-nfs-utils
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -e
              # --initdb builds a bare root with no trusted signing keys
              # under /nfs-root/etc/apk/keys, so apk rejects every
              # package it fetches as UNTRUSTED and reports it as "no
              # such package" - copying this image's own already-trusted
              # keys into the new root first fixes that.
              mkdir -p /nfs-root/etc/apk/keys
              cp /etc/apk/keys/* /nfs-root/etc/apk/keys/
              # --initdb only creates a fresh package database under
              # /nfs-root - it does NOT carry over /etc/apk/repositories,
              # so apk has no index to resolve nfs-utils against unless
              # told explicitly. Passing --repository (twice, since main
              # and community are separate repos) does that without
              # needing that file to exist under the new root. Version
              # pinned to match this image's own alpine:3.20 tag above -
              # keep them in sync if that tag changes.
              apk add --no-cache --root /nfs-root --initdb \
                --repository http://dl-cdn.alpinelinux.org/alpine/v3.20/main \
                --repository http://dl-cdn.alpinelinux.org/alpine/v3.20/community \
                nfs-utils
              mkdir -p /shared-nfs
              cp -a /nfs-root/. /shared-nfs/
          volumeMounts:
            - name: nfs-bin
              mountPath: /shared-nfs
      containers:
        # Tunnels only this pod's network namespace. qbittorrent (below)
        # shares it automatically - containers in a pod always share one
        # network namespace - so its torrent traffic is routed through the
        # VPN and firewalled off if the tunnel drops. Sonarr/Radarr/etc talk
        # to qbittorrent's WebUI over the normal cluster network; they
        # aren't tunneled.
        #
        # Needs a Secret named "vpn-wireguard-config" - see
        # vpn-secret.enc.yaml (sops-encrypted, same pattern as
        # platform/frpc/secret.enc.yaml) for the values from Mullvad's
        # downloaded WireGuard config file:
        #   WIREGUARD_PRIVATE_KEY   - [Interface] PrivateKey
        #   WIREGUARD_ADDRESSES     - [Interface] Address
        #   WIREGUARD_PUBLIC_KEY    - [Peer] PublicKey
        #   WIREGUARD_ENDPOINT_IP   - host part of [Peer] Endpoint
        #   WIREGUARD_ENDPOINT_PORT - port part of [Peer] Endpoint
        # Using "custom" (rather than gluetun's built-in "mullvad" provider,
        # which picks a server itself from SERVER_COUNTRIES/etc) pins the
        # exact server Mullvad put in the downloaded config.
        - name: gluetun
          image: qmcgaw/gluetun:v3.40.0
          ports:
            - containerPort: 8888
              name: http-proxy
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "custom"
            - name: VPN_TYPE
              value: "wireguard"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: vpn-wireguard-config
                  key: WIREGUARD_PRIVATE_KEY
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: vpn-wireguard-config
                  key: WIREGUARD_ADDRESSES
            - name: WIREGUARD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: vpn-wireguard-config
                  key: WIREGUARD_PUBLIC_KEY
            - name: WIREGUARD_ENDPOINT_IP
              valueFrom:
                secretKeyRef:
                  name: vpn-wireguard-config
                  key: WIREGUARD_ENDPOINT_IP
            - name: WIREGUARD_ENDPOINT_PORT
              valueFrom:
                secretKeyRef:
                  name: vpn-wireguard-config
                  key: WIREGUARD_ENDPOINT_PORT
            # Allows the ingress-nginx -> pod path to qbittorrent's WebUI
            # (8080) and other pods reaching gluetun's HTTP proxy (8888) to
            # bypass the VPN kill-switch firewall (inbound only - torrent
            # traffic itself still only goes out through the tunnel). A
            # port missing here means connections to it just hang (dropped,
            # not refused) rather than failing fast - 8888 was missing this
            # whole time gluetun-proxy looked otherwise correctly wired up
            # (valid Service, valid endpoint, gluetun listening internally).
            # Double check this var name against gluetun's current docs if
            # it doesn't work - it has been renamed between major versions.
            - name: FIREWALL_INPUT_PORTS
              value: "8080,8888"
            # Otherwise the kill-switch firewall also blocks the rclone
            # mount's outbound traffic to the internal Ceph RGW bucket
            # endpoint (BUCKET_HOST) - that's cluster-internal, not
            # internet traffic, so it should never go through the tunnel
            # anyway. This only decides which destinations skip the
            # tunnel, not whether internet-bound traffic can leak, so
            # covering all of RFC1918 10.0.0.0/8 instead of pinning the
            # exact pod/service CIDR split is fine and one less thing to
            # get wrong (pod CIDR is 10.244.0.0/16, but the service CIDR
            # BUCKET_HOST's ClusterIP actually falls in wasn't 10.96/12).
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.0.0.0/8"
            # gluetun otherwise hijacks DNS for the whole shared network
            # namespace, pointing /etc/resolv.conf at its own resolver
            # (127.0.0.1, DNS-over-TLS to a public upstream) - which has
            # no idea how to resolve cluster-internal names like the Ceph
            # RGW service (BUCKET_HOST). Keeping the original nameserver
            # (cluster CoreDNS, injected by kubelet) lets both resolve:
            # internal cluster names via CoreDNS as normal, and public
            # names via whatever CoreDNS forwards upstream through the
            # tunnel.
            - name: DNS_KEEP_NAMESERVER
              value: "on"
            # DNS_KEEP_NAMESERVER only stops gluetun from overwriting
            # /etc/resolv.conf - it doesn't necessarily stop gluetun's own
            # internal components (like the HTTP proxy below) from still
            # resolving through its built-in DoT resolver instead of the
            # system resolver. Turning DoT off entirely unifies everything
            # in this container onto the one resolver path (system
            # resolv.conf -> cluster CoreDNS), which is the likely fix for
            # the arr-stack's indexer requests failing to resolve through
            # the proxy.
            - name: DOT
              value: "off"
            # HTTP proxy for sonarr/radarr/prowlarr/bazarr - see the
            # gluetun-proxy Service above. Only reachable from inside the
            # cluster (ClusterIP), so no auth needed here. Logging enabled
            # so a real error is visible in this container's logs if
            # requests are still failing to resolve/connect.
            - name: HTTPPROXY
              value: "on"
            - name: HTTPPROXY_LOG
              value: "on"
            - name: TZ
              value: "Europe/Oslo"
          volumeMounts:
            # Kernel WireGuard is used when available (Talos's kernel
            # supports it); this is only a fallback for gluetun's userspace
            # implementation, same as it was for OpenVPN's tun interface.
            - name: tun-device
              mountPath: /dev/net/tun
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { memory: "128Mi" }
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.0.4
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Oslo"
            - name: WEBUI_PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: media-library-bucket
            - configMapRef:
                name: media-library-bucket
          ports:
            - containerPort: 8080
              name: webui
          # Bucket mount needs CAP_SYS_ADMIN for the mount(2) syscall; runs
          # in-process (postStart) rather than a sidecar, since
          # cross-container mount propagation doesn't work on this
          # cluster's Talos nodes. Same technique as immich-server.
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: rclone-bin
              mountPath: /opt/rclone-bin
              readOnly: true
            # NFS client tools (mount.nfs and its runtime libraries),
            # built by the install-nfs-utils initContainer above. See the
            # comment there for why this moved out of postStart.
            - name: nfs-bin
              mountPath: /opt/nfs-root
              readOnly: true
            # See the qbittorrent-custom-init ConfigMap above for what
            # this does and why - clears the stale IPC socket/lockfile
            # that qbittorrent-nox otherwise mistakes for a live instance
            # after an unclean shutdown.
            - name: custom-init
              mountPath: /custom-cont-init.d
            - name: vfs-cache
              mountPath: /rclone-cache
            - name: dl
              mountPath: /dl
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    set -e
                    # mount.nfs and its runtime libraries live under
                    # /opt/nfs-root (installed by the install-nfs-utils
                    # initContainer, not here - see its comment for why).
                    # rpcbind below and the mount.nfs helper invoked by
                    # `mount -t nfs` further down both need to resolve
                    # through this.
                    export PATH="/opt/nfs-root/sbin:/opt/nfs-root/usr/sbin:/opt/nfs-root/bin:/opt/nfs-root/usr/bin:$PATH"
                    export LD_LIBRARY_PATH="/opt/nfs-root/lib:/opt/nfs-root/usr/lib:${LD_LIBRARY_PATH:-}"
                    # mount.nfs needs /etc/protocols to resolve "tcp" as a
                    # protocol name, or it fails instantly with the
                    # misleading error "Protocol not supported" before even
                    # attempting the actual mount(2) syscall (confirmed via
                    # strace on jellyfin.yaml). The package that normally
                    # provides this varies by distro, and isn't available
                    # under any name we could find on Alpine - just
                    # guarantee the file exists directly instead of
                    # chasing per-distro package names.
                    if [ ! -s /etc/protocols ]; then
                      printf 'ip\t0\tIP\nicmp\t1\tICMP\ntcp\t6\tTCP\nudp\t17\tUDP\n' > /etc/protocols
                    fi
                    export RCLONE_CONFIG_CEPHBUCKET_TYPE=s3
                    export RCLONE_CONFIG_CEPHBUCKET_PROVIDER=Ceph
                    export RCLONE_CONFIG_CEPHBUCKET_ENV_AUTH=false
                    export RCLONE_CONFIG_CEPHBUCKET_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
                    export RCLONE_CONFIG_CEPHBUCKET_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
                    export RCLONE_CONFIG_CEPHBUCKET_ENDPOINT="http://$BUCKET_HOST:$BUCKET_PORT"
                    export RCLONE_CONFIG_CEPHBUCKET_REGION="$BUCKET_REGION"
                    mkdir -p /mnt/media
                    umount -l /mnt/media 2>/dev/null || true
                    rpcbind 2>/dev/null || true
                    # vfs-cache-mode writes: only files actively being
                    # written (i.e. mid-download) are cached on the local
                    # PVC - reads of already-uploaded, untouched files skip
                    # the cache entirely. Loopback only (127.0.0.1) - never
                    # reachable off-pod.
                    #
                    # --s3-chunk-size/--s3-upload-concurrency/--transfers
                    # cap worst-case multipart upload buffering per chunk.
                    # On their own, though, they don't stop a fast writer
                    # (cp, qbittorrent, sonarr/radarr) from pushing data
                    # into the VFS cache far faster than the throttled
                    # upload can drain it - nothing was pushing back on
                    # the writer, so the mismatch just piled up as page
                    # cache until it hit this container's memory limit and
                    # got OOM-killed (confirmed live: anon stayed flat
                    # ~50MB and file_dirty stayed near zero during a
                    # crash-inducing transfer - it was never the
                    # multipart buffer or a writeback backlog, it was
                    # unbounded clean page cache from the read side with
                    # no cap upstream).
                    #
                    # Do NOT add --vfs-cache-max-size here without making
                    # it larger than the largest single file that will be
                    # written. With --vfs-cache-mode writes the whole
                    # in-flight file is staged in --cache-dir, so a cap
                    # below the file size cannot be satisfied by eviction
                    # (the file is in use and not evictable) and shows up
                    # as an I/O error to the writer instead. It also
                    # bounds on-disk cache, not page cache, so it does
                    # nothing for the OOM in any case. The qbittorrent-
                    # vfs-cache PVC is 150Gi, which is itself the real
                    # ceiling on single-file size through this path.
                    #
                    # GOMEMLIMIT is the actual memory fix. Go's GC is not
                    # cgroup-aware: by default it sizes the heap against
                    # what it believes is available system memory and lets
                    # the heap roughly double over the live set before
                    # collecting, so rclone will happily expand into this
                    # container's memory.max and get OOM-killed. Raising
                    # resources.limits.memory does not help - it just
                    # gives the runtime more room to expand into before
                    # GC pressure kicks in, which is why 2Gi and 4Gi
                    # failed identically. This is a soft limit: the GC
                    # gets more aggressive as it is approached rather
                    # than failing allocations. Keep it well under
                    # resources.limits.memory below, since the limit also
                    # has to cover qbittorrent itself (~50-100MB
                    # observed) and page cache for the CephFS read side,
                    # the RBD cache-dir writes, and the NFS client.
                    export GOMEMLIMIT=1GiB
                    setsid /opt/rclone-bin/rclone serve nfs "cephbucket:$BUCKET_NAME" \
                      --addr 127.0.0.1:2049 \
                      --vfs-cache-mode writes \
                      --cache-dir /rclone-cache \
                      --dir-cache-time 1h \
                      --uid 1000 --gid 1000 --umask 022 \
                      --log-level INFO \
                      --s3-chunk-size 16M \
                      --s3-upload-concurrency 2 \
                      --transfers 1 \
                      --buffer-size 16M \
                      --vfs-write-back 5s \
                      > /proc/1/fd/1 2>/proc/1/fd/2 < /dev/null &
                    mounted=0
                    for i in $(seq 1 30); do
                      # rsize/wsize default to 1M here, and the kernel
                      # NFS client issues many of those in parallel. Each
                      # in-flight RPC is a buffer the userspace server
                      # (rclone/go-nfs, in this same cgroup) has to hold,
                      # so 1M x parallel writes is a multi-hundred-MB
                      # amplifier on top of rclone's own heap. 256K cuts
                      # that ~4x at negligible throughput cost for
                      # sequential large-file writes, which are already
                      # bounded by the S3 upload rate, not RPC size.
                      #
                      # timeo is in tenths of a second: 600 = 60s per
                      # attempt, retrans=2. On a soft mount that means
                      # the writer gets EIO rather than hanging if rclone
                      # stalls - which is what produced
                      # "cp: cannot stat ...: I/O error" rather than a
                      # clean failure. Widened to give a throttled upload
                      # room to finish an RPC.
                      if mount -t nfs -o vers=3,tcp,nolock,port=2049,mountport=2049,soft,rsize=262144,wsize=262144,timeo=1800,retrans=3 127.0.0.1:/ /mnt/media 2>/tmp/mount.err; then
                        mounted=1
                        break
                      fi
                      sleep 1
                    done
                    if [ "$mounted" -ne 1 ]; then
                      echo "failed to mount rclone NFS export after 30s, last error:" >&2
                      cat /tmp/mount.err >&2
                      exit 1
                    fi
            preStop:
              exec:
                command: ["umount", "-l", "/mnt/media"]
          # qbittorrent-nox does resume-data verification against every
          # torrent's referenced files on startup, and /mnt/media only
          # recently started actually mounting successfully - every
          # earlier attempt bailed out early on a stale lock file before
          # ever reaching this step. --vfs-cache-mode writes only caches
          # files actively being written, so this verification's reads go
          # straight through rclone to the S3 bucket uncached every time,
          # and took long enough to blow through even a widened 180s
          # liveness budget (measured ~200s and climbing). A startupProbe
          # gives it its own generous one-time allowance for this instead
          # of permanently loosening the steady-state liveness/readiness
          # checks below, which should stay tight for catching a real hang
          # once the app is actually up. Re-tighten this number once you
          # know the real startup time for your library size.
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: "200m", memory: "1Gi" }
            # Back to 2Gi deliberately. Raising this was tested at 2Gi
            # and 4Gi and failed identically, which is the signature of
            # an allocator that expands to fill whatever it is given
            # rather than a workload that needs more room - see the
            # GOMEMLIMIT comment on the rclone invocation above. The
            # bound now lives in GOMEMLIMIT (rclone's heap) and the NFS
            # rsize/wsize (per-RPC buffering); this limit only needs to
            # cover those plus qbittorrent itself and reclaimable page
            # cache. If it still OOMs, get the kernel's own OOM report
            # (talosctl dmesg, "memory cgroup out of memory") - it lists
            # the RSS of every task at kill time, which distinguishes an
            # rclone heap blowup from a page-cache/reclaim failure
            # instead of guessing between them.
            limits: { memory: "2Gi" }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: vfs-cache
          persistentVolumeClaim:
            claimName: qbittorrent-vfs-cache
        - name: dl
          persistentVolumeClaim:
            claimName: qbittorrent-dl
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: rclone-bin
          emptyDir: {}
        - name: nfs-bin
          emptyDir: {}
        - name: custom-init
          configMap:
            name: qbittorrent-custom-init
            defaultMode: 0755
