apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  parentRefs:
    - name: traefik-public-gateway
      namespace: traefik-public
      sectionName: websecure
  hostnames: ["jellyfin.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
---
