apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: ["qbittorrent.k8s.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: qbittorrent
          port: 8080
