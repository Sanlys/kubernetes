apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilium
  namespace: trilium
  labels: { app: trilium }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: trilium }
  template:
    metadata:
      labels: { app: trilium }
    spec:
      # The Service is named "trilium", which makes Kubernetes inject a
      # TRILIUM_PORT=tcp://<clusterIP>:8080 env var into the pod. Trilium
      # itself reads TRILIUM_PORT as its listen-port config and expects a
      # plain integer, so it fails to start unless service-link env
      # injection is disabled.
      enableServiceLinks: false
      containers:
        - name: trilium
          # triliumnext/notes:v0.95.0 (== latest/stable at time of writing)
          image: triliumnext/trilium:v0.104.1
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /home/node/trilium-data
          readinessProbe:
            httpGet: { path: /api/health-check, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /api/health-check, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trilium-data
      # Container starts as root to fix up ownership of the mounted data
      # volume, then re-execs the node process as uid/gid 1000:1000 itself.
      securityContext:
        runAsNonRoot: false
