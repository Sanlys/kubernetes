apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilium
  namespace: trilium
  labels: { app: trilium }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: trilium }
  template:
    metadata:
      labels: { app: trilium }
    spec:
      containers:
        - name: trilium
          # triliumnext/notes:v0.95.0 (== latest/stable at time of writing)
          image: triliumnext/notes@sha256:611a430016585d35b170eb9a0fa300ce76318f04a8ec0067549c4c52561b0c36
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /home/node/trilium-data
          readinessProbe:
            httpGet: { path: /api/health-check, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /api/health-check, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trilium-data
