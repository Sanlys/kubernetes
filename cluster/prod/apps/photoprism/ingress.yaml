apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: photoprism
  namespace: photoprism
spec:
  parentRefs:
    - name: traefik-public-gateway
      namespace: traefik-public
      sectionName: websecure
  hostnames: ["photoprism.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: photoprism
          port: 2342
