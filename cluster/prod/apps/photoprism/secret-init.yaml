# RBAC so the Job can create the Secret
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-init
  namespace: photoprism
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-init
  namespace: photoprism
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-init
  namespace: photoprism
subjects:
  - kind: ServiceAccount
    name: secret-init
    namespace: photoprism
roleRef:
  kind: Role
  name: secret-init
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: photoprism-secret-init
  namespace: photoprism
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: secret-init
      restartPolicy: OnFailure
      containers:
        - name: generate
          image: alpine:3.20
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail

              apk add --no-cache kubectl

              if kubectl -n photoprism get secret photoprism-secrets >/dev/null 2>&1; then
                echo "Secret photoprism-secrets already exists; exiting."
                exit 0
              fi

              DB_PASSWORD="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
              ADMIN_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -d '\n')"

              kubectl -n photoprism create secret generic photoprism-secrets \
                --from-literal=DB_PASSWORD="$DB_PASSWORD" \
                --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD"
