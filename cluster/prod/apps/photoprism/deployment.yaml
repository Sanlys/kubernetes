apiVersion: v1
kind: Service
metadata:
  name: photoprism
  namespace: photoprism
spec:
  selector:
    app: photoprism
  ports:
    - name: http
      port: 2342
      targetPort: 2342
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-storage
  namespace: photoprism
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-block-ssd
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoprism
  namespace: photoprism
spec:
  replicas: 1
  # RollingUpdate's default maxSurge would schedule a second pod (possibly on
  # another node) before killing the old one - fatal for the RWO
  # photoprism-storage PVC (Multi-Attach error).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: photoprism
  template:
    metadata:
      labels:
        app: photoprism
    spec:
      containers:
        - name: photoprism
          image: photoprism/photoprism:261029
          ports:
            - containerPort: 2342
              name: http
          envFrom:
            - configMapRef:
                name: photoprism-env
          env:
            - name: PHOTOPRISM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism-secrets
                  key: DB_PASSWORD
            - name: PHOTOPRISM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism-secrets
                  key: ADMIN_PASSWORD
          # The NFS mount of the photo library needs CAP_SYS_ADMIN for the
          # mount(2) syscall; it runs in-process (postStart, below) since
          # cross-container mount propagation doesn't work on these nodes.
          securityContext:
            privileged: true
          volumeMounts:
            - name: storage
              mountPath: /photoprism/storage
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    set -e
                    # The photo library (bucket immich-external-library, the
                    # same one immich reads) is served read-only by the
                    # central nfs-gateway (platform/nfs-gateway), the same
                    # way sonarr and qbittorrent get media-library. This pod
                    # only needs the NFS client: no rclone, no bucket
                    # credentials, much less memory at startup.
                    export DEBIAN_FRONTEND=noninteractive
                    apt-get update -qq
                    apt-get install -y -qq --no-install-recommends nfs-common
                    # mount.nfs needs /etc/protocols to resolve "tcp", or it
                    # fails with "Protocol not supported" (see sonarr.yaml).
                    if [ ! -s /etc/protocols ]; then
                      printf 'ip\t0\tIP\nicmp\t1\tICMP\ntcp\t6\tTCP\nudp\t17\tUDP\n' > /etc/protocols
                    fi
                    # Mounted as a subfolder of /photoprism/originals rather
                    # than at /photoprism/originals itself - PhotoPrism
                    # expects different sources to be separate subdirectories
                    # (see https://www.photoprism.app/pro/kb/volumes/);
                    # mounting the bucket directly onto the originals root
                    # left some files unindexed.
                    mkdir -p /photoprism/originals/media
                    umount -l /photoprism/originals/media 2>/dev/null || true
                    # Same vers=4.1,soft,proto=tcp recipe sonarr uses against
                    # the gateway, mounted from this pod's netns so cluster
                    # DNS resolves (a native kubelet `nfs:` volume can't).
                    # 120s: the gateway only adds this export once its own
                    # rclone mount of the bucket is up.
                    mounted=0
                    for i in $(seq 1 120); do
                      if mount -t nfs -o vers=4.1,soft,proto=tcp,ro nfs-gateway.nfs-gateway.svc.cluster.local:/immich-external-library /photoprism/originals/media 2>/tmp/mount.err; then
                        mounted=1
                        break
                      fi
                      sleep 1
                    done
                    if [ "$mounted" -ne 1 ]; then
                      echo "failed to mount nfs-gateway export after 120s, last error:" >&2
                      cat /tmp/mount.err >&2
                      exit 1
                    fi
            preStop:
              exec:
                command: ["umount", "-l", "/photoprism/originals/media"]
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: 2342
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          # Liveness also checks the nfs-gateway mount: if the gateway dies or
          # wedges, the soft mount returns I/O errors forever and only a
          # container restart (re-running postStart) fixes it. HTTP check uses curl/wget if the image has one.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  grep -q " /photoprism/originals/media " /proc/mounts || exit 1
                  timeout -s KILL 15 ls /photoprism/originals/media >/dev/null || exit 1
                  if command -v curl >/dev/null 2>&1; then
                    curl -fsS -o /dev/null -m 5 http://127.0.0.1:2342/api/v1/status
                  elif command -v wget >/dev/null 2>&1; then
                    wget -q -O /dev/null -T 5 http://127.0.0.1:2342/api/v1/status
                  fi
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 25
            failureThreshold: 6
          resources:
            # Memory limit = request per repo convention, sized for indexing/
            # TensorFlow peaks (PhotoPrism recommends >= 4GB) rather than idle.
            requests: { cpu: "500m", memory: "4Gi" }
            limits: { memory: "4Gi" }
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: photoprism-storage
