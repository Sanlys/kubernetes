apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Never let Argo CD prune/delete this claim: the StorageClass reclaim
  # policy is Delete, so losing the claim would destroy the data.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: forgejo-data
  namespace: forgejo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block-ssd
  resources:
    requests:
      storage: 10Gi
