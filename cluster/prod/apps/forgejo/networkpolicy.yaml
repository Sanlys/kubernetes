# Ingress only from traefik-public (ingress.yaml only attaches there, no
# internal route). Selecting this pod for ingress switches it from
# default-allow to default-deny-except-listed - same mechanism as
# s3-vfs-proxy/smb-gateway. postgres (same namespace) isn't selected by
# any policy, so it stays reachable from forgejo unaffected.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-traefik-public-only
  namespace: forgejo
spec:
  endpointSelector:
    matchLabels:
      app: forgejo
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-public
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
