apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-public
    # Git pushes (especially with large objects/LFS) can exceed nginx's
    # default body-size cap and shouldn't be buffered to disk before
    # forwarding.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: public
  tls:
    - hosts: [ "git.lysakermoen.com" ]
      secretName: forgejo-tls
  rules:
    - host: git.lysakermoen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo
                port:
                  number: 3000
