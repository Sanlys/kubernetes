apiVersion: v1
kind: Service
metadata:
  name: syncthing-sftp
  namespace: syncthing
spec:
  # In-cluster only: smb-gateway reaches it as
  # syncthing-sftp.syncthing.svc.cluster.local. It used to be a LAN
  # LoadBalancer (10.0.6.206) that nothing on the LAN used.
  type: ClusterIP
  selector:
    app: syncthing
  ports:
    - name: sftp
      port: 22
      targetPort: 22
      protocol: TCP
