apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: syncthing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: syncthing
          image: syncthing/syncthing:2.0.14
          imagePullPolicy: IfNotPresent
          ports:
            - name: gui
              containerPort: 8384
              protocol: TCP
            - name: sync-tcp
              containerPort: 22000
              protocol: TCP
            - name: sync-udp
              containerPort: 22000
              protocol: UDP
            - name: discovery
              containerPort: 21027
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /var/syncthing
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              memory: 512Mi

        - name: sftp
          image: atmoz/sftp:alpine-3.7
          args:
            - user:password:1000:1000:upload
          ports:
            - name: sftp
              containerPort: 22
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /home/user/upload
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 256Mi

        - name: rclone-sync
          image: rclone/rclone:1.68
          env:
            - name: BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: syncthing-images-bucket
                  key: BUCKET_NAME
            - name: BUCKET_HOST
              valueFrom:
                configMapKeyRef:
                  name: syncthing-images-bucket
                  key: BUCKET_HOST
            - name: BUCKET_PORT
              valueFrom:
                configMapKeyRef:
                  name: syncthing-images-bucket
                  key: BUCKET_PORT
            - name: BUCKET_REGION
              valueFrom:
                configMapKeyRef:
                  name: syncthing-images-bucket
                  key: BUCKET_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: syncthing-images-bucket
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: syncthing-images-bucket
                  key: AWS_SECRET_ACCESS_KEY
            - name: RCLONE_CONFIG_CEPHBUCKET_TYPE
              value: "s3"
            - name: RCLONE_CONFIG_CEPHBUCKET_PROVIDER
              value: "Ceph"
            - name: RCLONE_CONFIG_CEPHBUCKET_ENV_AUTH
              value: "false"
            - name: RCLONE_CONFIG_CEPHBUCKET_ACCESS_KEY_ID
              value: "$(AWS_ACCESS_KEY_ID)"
            - name: RCLONE_CONFIG_CEPHBUCKET_SECRET_ACCESS_KEY
              value: "$(AWS_SECRET_ACCESS_KEY)"
            - name: RCLONE_CONFIG_CEPHBUCKET_ENDPOINT
              value: "http://$(BUCKET_HOST):$(BUCKET_PORT)"
            - name: RCLONE_CONFIG_CEPHBUCKET_REGION
              value: "$(BUCKET_REGION)"
          command: ["sh", "-c"]
          args:
            - |
              set -e
              trap 'exit 0' TERM INT
              while true; do
                # one-way: /data/Bilder -> bucket only, rclone sync never
                # writes back to the (read-only mounted) source
                rclone sync /data/Bilder "cephbucket:$(BUCKET_NAME)" \
                  --create-empty-src-dirs \
                  --fast-list \
                  --log-level INFO
                # backgrounded + waited so the trap fires immediately on
                # SIGTERM instead of waiting out the full sleep
                sleep 300 &
                wait $!
              done
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: syncthing-config
        - name: data
          persistentVolumeClaim:
            claimName: syncthing-pvc
