apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: syncthing
  namespace: syncthing
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: ["syncthing.k8s.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: syncthing
          port: 8384
