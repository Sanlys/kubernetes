apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-pvc
  namespace: syncthing
spec:
  storageClassName: rook-ceph-block-hdd
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 175Gi
---
# RWX replacement for syncthing-pvc: CephFS instead of RBD, so
# restic-backup no longer needs podAffinity to the syncthing Deployment
# just to avoid an RWO multi-attach conflict - that CronJob has no
# activeDeadlineSeconds, so a stuck Pending run under Forbid never
# self-heals. syncthing-pvc (RBD) is kept around, unused, as a rollback
# option until this is confirmed solid.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-pvc-rwx
  namespace: syncthing
spec:
  storageClassName: rook-cephfs
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      # Was 175Gi, same as the usage was already at 90% (157.1G/175G) right
      # after cutover - not caused by the migration, just inherited from
      # syncthing-pvc. CephFS supports online expansion, so grown here
      # instead of waiting for KubePersistentVolumeFillingUp's 4-day ETA.
      storage: 300Gi
