apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: s3-vfs-proxy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sanlys/kubernetes.git
    targetRevision: main
    path: cluster/prod/apps/s3-vfs-proxy
    directory:
      exclude: "{app.yaml,harbor-pull-secret.enc.yaml,upstream-creds-secret.enc.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: s3-vfs-proxy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
