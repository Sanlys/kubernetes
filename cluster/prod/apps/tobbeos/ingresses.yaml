apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tobbeos-public
  namespace: tobbeos
spec:
  parentRefs:
    - name: traefik-public-gateway
      namespace: traefik-public
      sectionName: websecure
  hostnames: ["tobbeos.lysakermoen.com"]
  rules:
    # More specific path first - Gateway API implementations should pick
    # the longest-prefix match regardless of order, but listing it first
    # keeps this readable without relying on that.
    - matches:
        - path: { type: PathPrefix, value: /iso }
      backendRefs:
        - name: iso-nginx
          port: 80
    - backendRefs:
        - name: tobbeos
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tos-redirect
  namespace: tobbeos
spec:
  parentRefs:
    - name: traefik-public-gateway
      namespace: traefik-public
      sectionName: websecure
  hostnames: ["tos.lysakermoen.com"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: tobbeos.lysakermoen.com
            statusCode: 301
