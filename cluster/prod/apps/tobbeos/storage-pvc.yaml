apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tobbeos-pvc
  namespace: tobbeos
spec:
  storageClassName: rook-ceph-block-hdd
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# RWX replacement for tobbeos-pvc: CephFS instead of RBD, so git-sync-job
# no longer needs podAffinity to the tobbeos Deployment just to avoid an
# RWO multi-attach conflict. tobbeos-pvc (RBD) is kept around, unused,
# as a rollback option until this is confirmed solid.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tobbeos-pvc-rwx
  namespace: tobbeos
spec:
  storageClassName: rook-cephfs
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi