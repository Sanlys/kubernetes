apiVersion: v1
kind: Service
metadata:
  name: tobbeos
  namespace: tobbeos
  labels: { app: tobbeos }
spec:
  # Was type: LoadBalancer with its own IP, predating the HTTPRoutes in
  # ingresses.yaml - dead weight once Traefik took over routing.
  selector: { app: tobbeos }
  ports:
    - name: http
      port: 80
      targetPort: http
