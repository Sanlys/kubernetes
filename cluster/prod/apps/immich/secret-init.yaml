# RBAC so the Job can create the Secret
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-init
  namespace: immich
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-init
  namespace: immich
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-init
  namespace: immich
subjects:
  - kind: ServiceAccount
    name: secret-init
    namespace: immich
roleRef:
  kind: Role
  name: secret-init
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-secret-init
  namespace: immich
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: secret-init
      restartPolicy: OnFailure
      containers:
        - name: generate
          image: alpine:3.24
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail

              apk add --no-cache kubectl

              if kubectl -n immich get secret immich-secrets >/dev/null 2>&1; then
                echo "Secret immich-secrets already exists; exiting."
                exit 0
              fi

              DB_PASSWORD="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"

              kubectl -n immich create secret generic immich-secrets \
                --from-literal=DB_PASSWORD="$DB_PASSWORD"
