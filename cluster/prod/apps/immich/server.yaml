apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: 2283
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-upload
  namespace: immich
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-block-hdd
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release
          ports:
            - containerPort: 2283
              name: http
          envFrom:
            - configMapRef:
                name: immich-env
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://immich-machine-learning:3003"
          volumeMounts:
            - name: upload
              mountPath: /usr/src/app/upload
            # Populated by the rclone-mount sidecar; register it as a read-only
            # External Library import path in the Immich admin UI after deploy.
            - name: external-library
              mountPath: /mnt/library
              mountPropagation: HostToContainer
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "4Gi" }

        - name: rclone-mount
          image: rclone/rclone:1.68
          # Bidirectional propagation (required for the FUSE mount to appear in
          # the immich-server container) is only permitted on privileged containers.
          securityContext:
            privileged: true
          env:
            - name: BUCKET_HOST
              valueFrom:
                configMapKeyRef:
                  name: immich-external-library
                  key: BUCKET_HOST
            - name: BUCKET_PORT
              valueFrom:
                configMapKeyRef:
                  name: immich-external-library
                  key: BUCKET_PORT
            - name: BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: immich-external-library
                  key: BUCKET_NAME
            - name: BUCKET_REGION
              valueFrom:
                configMapKeyRef:
                  name: immich-external-library
                  key: BUCKET_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: immich-external-library
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-external-library
                  key: AWS_SECRET_ACCESS_KEY
            - name: RCLONE_CONFIG_CEPHBUCKET_TYPE
              value: "s3"
            - name: RCLONE_CONFIG_CEPHBUCKET_PROVIDER
              value: "Ceph"
            - name: RCLONE_CONFIG_CEPHBUCKET_ENV_AUTH
              value: "false"
            - name: RCLONE_CONFIG_CEPHBUCKET_ACCESS_KEY_ID
              value: "$(AWS_ACCESS_KEY_ID)"
            - name: RCLONE_CONFIG_CEPHBUCKET_SECRET_ACCESS_KEY
              value: "$(AWS_SECRET_ACCESS_KEY)"
            - name: RCLONE_CONFIG_CEPHBUCKET_ENDPOINT
              value: "http://$(BUCKET_HOST):$(BUCKET_PORT)"
            - name: RCLONE_CONFIG_CEPHBUCKET_REGION
              value: "$(BUCKET_REGION)"
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /mnt/library
              echo "user_allow_other" >> /etc/fuse.conf
              exec rclone mount "cephbucket:$(BUCKET_NAME)" /mnt/library \
                --allow-other \
                --read-only \
                --vfs-cache-mode minimal \
                --dir-cache-time 1h \
                --poll-interval 15s \
                --uid 1000 --gid 1000 --umask 022 \
                --log-level INFO
          volumeMounts:
            - name: external-library
              mountPath: /mnt/library
              mountPropagation: Bidirectional
            - name: fuse-device
              mountPath: /dev/fuse
          lifecycle:
            preStop:
              exec:
                command: ["fusermount", "-u", "/mnt/library"]

      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: immich-upload
        - name: external-library
          emptyDir: {}
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice
