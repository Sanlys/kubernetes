apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: 2283
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-upload
  namespace: immich
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-block-hdd
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  # RollingUpdate's default maxSurge would schedule a second pod (possibly on
  # another node) before killing the old one - fatal for the RWO immich-upload
  # PVC (Multi-Attach error).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      serviceAccountName: bucket-reader
      initContainers:
        - name: fetch-bucket-creds
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache kubectl
              {
                echo "AWS_ACCESS_KEY_ID=$(kubectl -n syncthing get secret syncthing-images-bucket -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)"
                echo "AWS_SECRET_ACCESS_KEY=$(kubectl -n syncthing get secret syncthing-images-bucket -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"
                echo "BUCKET_NAME=$(kubectl -n syncthing get configmap syncthing-images-bucket -o jsonpath='{.data.BUCKET_NAME}')"
                echo "BUCKET_HOST=$(kubectl -n syncthing get configmap syncthing-images-bucket -o jsonpath='{.data.BUCKET_HOST}')"
                echo "BUCKET_PORT=$(kubectl -n syncthing get configmap syncthing-images-bucket -o jsonpath='{.data.BUCKET_PORT}')"
                echo "BUCKET_REGION=$(kubectl -n syncthing get configmap syncthing-images-bucket -o jsonpath='{.data.BUCKET_REGION}')"
              } > /shared/bucket.env
          volumeMounts:
            - name: bucket-creds
              mountPath: /shared
        # Copies the rclone binary into the immich-server container itself -
        # the mount now happens there directly (see postStart below) instead
        # of in a sidecar, since cross-container mount propagation
        # (Bidirectional/HostToContainer) silently doesn't work on this
        # cluster's nodes (requires kubelet/containerd MountFlags=shared,
        # which Talos doesn't set up).
        - name: copy-rclone-binary
          image: rclone/rclone:1.68
          command: ["sh", "-c", "cp \"$(command -v rclone)\" /shared-bin/rclone && chmod +x /shared-bin/rclone"]
          volumeMounts:
            - name: rclone-bin
              mountPath: /shared-bin
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.1.0
          ports:
            - containerPort: 2283
              name: http
          envFrom:
            - configMapRef:
                name: immich-env
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://immich-machine-learning:3003"
          # The FUSE mount for the external library needs CAP_SYS_ADMIN and
          # /dev/fuse; it runs in-process (postStart, below) rather than in a
          # sidecar so it doesn't depend on cross-container mount propagation.
          securityContext:
            privileged: true
          volumeMounts:
            - name: upload
              mountPath: /usr/src/app/upload
            - name: fuse-device
              mountPath: /dev/fuse
            - name: rclone-bin
              mountPath: /opt/rclone-bin
              readOnly: true
            - name: bucket-creds
              mountPath: /shared
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    set -e
                    # credentials for syncthing's Ceph user, which actually
                    # owns the bucket and its objects (see fetch-bucket-creds
                    # init container and bucket-reader-rbac.yaml)
                    . /shared/bucket.env
                    export RCLONE_CONFIG_CEPHBUCKET_TYPE=s3
                    export RCLONE_CONFIG_CEPHBUCKET_PROVIDER=Ceph
                    export RCLONE_CONFIG_CEPHBUCKET_ENV_AUTH=false
                    export RCLONE_CONFIG_CEPHBUCKET_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
                    export RCLONE_CONFIG_CEPHBUCKET_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
                    export RCLONE_CONFIG_CEPHBUCKET_ENDPOINT="http://$BUCKET_HOST:$BUCKET_PORT"
                    export RCLONE_CONFIG_CEPHBUCKET_REGION="$BUCKET_REGION"
                    mkdir -p /mnt/library
                    echo "user_allow_other" >> /etc/fuse.conf 2>/dev/null || true
                    umount -l /mnt/library 2>/dev/null || true
                    setsid /opt/rclone-bin/rclone mount "cephbucket:$BUCKET_NAME" /mnt/library \
                      --allow-other \
                      --read-only \
                      --vfs-cache-mode minimal \
                      --dir-cache-time 1h \
                      --uid 1000 --gid 1000 --umask 022 \
                      --log-level INFO \
                      > /proc/1/fd/1 2>/proc/1/fd/2 < /dev/null &
            preStop:
              exec:
                command: ["umount", "-l", "/mnt/library"]
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "4Gi" }

      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: immich-upload
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: bucket-creds
          emptyDir: {}
        - name: rclone-bin
          emptyDir: {}
