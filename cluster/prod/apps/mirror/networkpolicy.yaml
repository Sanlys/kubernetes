# Ingress only from the two Traefik instances that front it (see
# ingresses.yaml). Selecting these pods for ingress switches them from
# default-allow to default-deny-except-listed - same mechanism as
# s3-vfs-proxy/smb-gateway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-traefik-only
  namespace: mirror
spec:
  endpointSelector:
    matchLabels:
      app: mirror
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-public
        # mirror-freshness-check (freshness-check.yaml) curls /lastsync
        # directly off this Service - same namespace, so no namespace label
        # needed here, unlike the two cross-namespace Traefik rules above.
        - matchLabels:
            app: mirror-freshness-check
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
