apiVersion: v1
kind: ConfigMap
metadata:
  name: mirror-nginx
  namespace: mirror
data:
  nginx.conf: |
    events {}

    http {
        # Without this, $remote_addr is always Traefik's own pod IP (every
        # request is proxied through it) - confirmed live, even an external
        # crawler's request logged Traefik's 10.244.x.x address, not the
        # real client. Traefik always sets X-Forwarded-For; trusting the
        # whole pod CIDR as the proxy to recurse past is correct here since
        # nothing outside the cluster can reach this Service directly to
        # spoof it.
        real_ip_header X-Forwarded-For;
        set_real_ip_from 10.244.0.0/16;
        real_ip_recursive on;

        # JSON access log for the Alloy pipeline to parse (GeoIP enrichment
        # + Prometheus metrics - see cluster/prod/platform/monitoring/alloy).
        # Pure logging change - doesn't touch how requests are actually
        # served below.
        log_format json_combined escape=json
          '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":"$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent"'
          '}';
        access_log /dev/stdout json_combined;

        server {
            listen 80;
            server_name _;

            location / {
                root /usr/share/nginx/html;
                autoindex on;
                autoindex_exact_size off;
                autoindex_localtime on;
            }
        }
    }
