apiVersion: batch/v1
kind: CronJob
metadata:
  name: mirror-sync
  namespace: mirror
spec:
  schedule: "31 */6 * * *"
  concurrencyPolicy: Forbid
  # Was 0 - the pod was deleted the instant the Job succeeded, before Alloy's
  # Kubernetes-API log tailing (loki.source.kubernetes, which can only tail
  # pods that still exist) ever got a chance to discover and read it. Result:
  # the mirror_lastsync_epoch_seconds gauge never got a single data point,
  # ever, despite the pipeline being configured correctly. 1 keeps the pod
  # around until the next run replaces it 6h later - plenty of time for
  # Alloy's discovery loop (sub-minute) to catch it.
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # archmirror-pvc-rwx is CephFS (RWX): this no longer needs to co-locate
      # with the mirror Deployment's pod, so a stuck node can't block it.
      # rsync resumes where it left off, so cutting a long run short is safe.
      activeDeadlineSeconds: 18000
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: archmirror
              persistentVolumeClaim:
                claimName: archmirror-pvc-rwx
            - name: mirror-script
              configMap:
                name: mirror-script
                defaultMode: 0755
          containers:
            - name: mirror-sync
              image: alpine:3.24.2
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  apk add --no-cache bash rsync curl util-linux ca-certificates
                  echo "[mirror-sync] running mirror script"
                  /mirror.sh /mirrors/archlinux /archlinux.lck rsync://mirror.neuf.no/archlinux https://mirror.neuf.no/archlinux/lastupdate
              volumeMounts:
                - name: archmirror
                  mountPath: /mirrors/archlinux
                - name: mirror-script
                  mountPath: /mirror.sh
                  subPath: mirror.sh
              resources:
                requests:
                  cpu: 100m
                  memory: 5644Mi
                limits:
                  memory: 5644Mi
