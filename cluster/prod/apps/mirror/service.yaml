apiVersion: v1
kind: Service
metadata:
  name: mirror
  namespace: mirror
  labels: { app: mirror }
spec:
  # Was type: LoadBalancer with its own IP, predating the HTTPRoutes in
  # ingresses.yaml - dead weight once Traefik took over routing.
  selector: { app: mirror }
  ports:
    - name: http
      port: 80
      targetPort: http
