apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: archlinux-internal
  namespace: mirror
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: ["archlinux.k8s.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: mirror
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: archlinux-public
  namespace: mirror
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-public
spec:
  ingressClassName: public
  tls:
    - hosts: [ "archlinux.lysakermoen.com" ]
      secretName: archlinux-public-tls
  rules:
    - host: archlinux.lysakermoen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mirror
                port:
                  number: 80