apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: archlinux-internal
  namespace: mirror
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: ["archlinux.k8s.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: mirror
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: archlinux-public
  namespace: mirror
spec:
  parentRefs:
    - name: traefik-public-gateway
      namespace: traefik-public
      sectionName: websecure
  hostnames: ["archlinux.lysakermoen.com"]
  rules:
    - backendRefs:
        - name: mirror
          port: 80