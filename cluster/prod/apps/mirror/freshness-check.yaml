# Checks the same /lastsync file mirror-sync itself writes (see syncer.yaml),
# but over HTTP against the mirror's own Service instead of reading the file
# off the shared PVC from inside the sync job - this is what Alloy used to
# scrape out of the sync job's pod logs via Kubernetes-API log tailing,
# which only worked at all once successfulJobsHistoryLimit left the pod
# alive long enough to be discovered (see syncer.yaml). Hitting the Service
# directly removes that timing dependency entirely and additionally proves
# nginx is actually serving the current file, not just that it exists on
# disk. Runs far more often than the 6h sync schedule since it's a single
# cheap GET, giving the dashboard's freshness panel much finer granularity.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mirror-freshness-check
  namespace: mirror
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      # Never + backoffLimit instead of OnFailure: a failed attempt's pod
      # (and its logs) survives for failedJobsHistoryLimit to keep, rather
      # than being restarted in place and then reaped at the deadline with
      # nothing left to debug.
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: mirror-freshness-check
        spec:
          restartPolicy: Never
          containers:
            - name: mirror-freshness-check
              image: alpine:3.24.3
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # busybox wget ships in the base image - the old
                  # `apk add curl` pulled from the Alpine CDN every 5 minutes
                  # and was the flaky part (one stalled download burned the
                  # whole 60s deadline). Per-request timeout + retries, and
                  # the value must be a bare epoch: a failed fetch inside
                  # $(...) used to just print an empty line and exit 0.
                  fetch() {
                    for attempt in 1 2 3; do
                      v=$(wget -qO- -T 5 "http://mirror.mirror.svc.cluster.local/$1" 2>/dev/null) || v=""
                      case "$v" in
                        ''|*[!0-9]*) echo "fetch /$1 attempt $attempt failed: got '$v'" >&2; sleep 3 ;;
                        *) echo "$v"; return 0 ;;
                      esac
                    done
                    return 1
                  }
                  lastsync=$(fetch lastsync)
                  lastupdate=$(fetch lastupdate)
                  # Grepped by the Alloy pipeline for the dashboard's
                  # sync-freshness panels - see
                  # cluster/prod/platform/monitoring/alloy. lastsync is when
                  # WE last finished a sync run; lastupdate is rsync'd
                  # straight from upstream (see mirror-script.yaml) and
                  # reflects when upstream itself last published - the two
                  # legitimately differ by however stale we are relative to
                  # upstream at sync time.
                  echo "MIRROR_LASTSYNC_EPOCH=$lastsync"
                  echo "MIRROR_LASTUPDATE_EPOCH=$lastupdate"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
